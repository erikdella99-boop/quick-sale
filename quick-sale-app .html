const CalendarioScreen = ({ inventory, reservations, onAddReservation, onBack }) => {
  const [selected, setSelected] = useState("2026-09-15");
  const [showForm, setShowForm] = useState(false);
  const [itemId, setItemId] = useState(inventory[0]?.id);
  const [qty, setQty] = useState(1);
  const [from, setFrom] = useState("2026-09-12");
  const [to, setTo] = useState("2026-09-15");
  const [client, setClient] = useState("");
  const [error, setError] = useState("");
  const [confirmed, setConfirmed] = useState(false);

  const days = Array.from({ length: 30 }, (_, i) => i + 1);
  const dayIso = (d) => `2026-09-${String(d).padStart(2, "0")}`;

  const statusFor = (iso) => {
    const dayRes = reservations.filter((r) => overlaps(r.from, r.to, iso, iso));
    if (dayRes.length === 0) return null;
    const isEdge = dayRes.some((r) => r.from === iso || r.to === iso);
    return dayRes.length > 1 || !isEdge ? "busy" : "partial";
  };

  const dayReservations = reservations.filter((r) => overlaps(r.from, r.to, selected, selected));

  const checkAndSubmit = () => {
    setError("");
    setConfirmed(false);
    const item = inventory.find((i) => i.id === Number(itemId));
    if (!item) return;
    const overlapping = reservations.filter((r) => r.itemId === item.id && overlaps(r.from, r.to, from, to));
    const reservedQty = overlapping.reduce((a, r) => a + r.qty, 0);
    if (reservedQty + Number(qty) > item.stock) {
      setError(`No disponible para esas fechas — quedan ${Math.max(item.stock - reservedQty, 0)} unidades libres`);
      return;
    }
    onAddReservation({
      id: Date.now(),
      itemId: item.id,
      itemName: item.name,
      qty: Number(qty),
      from,
      to,
      client: client || "Sin nombre",
    });
    setConfirmed(true);
    setClient("");
  };

  return (
    <div className="px-4 pt-6 pb-28">
      <ToolHeader title="Calendario" onBack={onBack} />

      <div className="flex items-center justify-between mb-2">
        <span className="font-display font-bold text-sm uppercase">Septiembre 2026</span>
        <button onClick={() => setShowForm((s) => !s)} className="font-body text-xs font-bold text-ink underline">
          {showForm ? "Cerrar" : "+ Nueva reserva"}
        </button>
      </div>

      {showForm && (
        <Card className="p-3 mb-3 flex flex-col gap-2.5 bg-cream">
          <select value={itemId} onChange={(e) => setItemId(e.target.value)} className="bg-white border-2 border-ink/10 rounded-lg px-2.5 py-2 font-body text-sm outline-none">
            {inventory.map((i) => <option key={i.id} value={i.id}>{i.name} (stock {i.stock})</option>)}
          </select>

/* ---------------- ESCÁNER QR / CÓDIGO DE BARRAS ---------------- */
const ScannerScreen = ({ inventory, onBack, online, log, addLog }) => {
  const videoRef = useRef(null);
  const canvasRef = useRef(null);
  const [scanning, setScanning] = useState(false);
  const [cameraError, setCameraError] = useState("");
  const [manualCode, setManualCode] = useState("");

  useEffect(() => {
    let stream;
    let raf;
    const start = async () => {
      try {
        stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: "environment" } });
        videoRef.current.srcObject = stream;
        await videoRef.current.play();
        setScanning(true);
        const tick = () => {
          if (!videoRef.current || videoRef.current.readyState !== 4) {
            raf = requestAnimationFrame(tick);
            return;
          }
          const canvas = canvasRef.current;
          canvas.width = videoRef.current.videoWidth;
          canvas.height = videoRef.current.videoHeight;
          const ctx = canvas.getContext("2d");
          ctx.drawImage(videoRef.current, 0, 0, canvas.width, canvas.height);
          const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
          const code = window.jsQR && window.jsQR(imgData.data, canvas.width, canvas.height);
          if (code && code.data) {
            addLog(code.data, "Escaneado");
          }
          raf = requestAnimationFrame(tick);
        };
        raf = requestAnimationFrame(tick);
      } catch (e) {
        setCameraError("Sin acceso a la cámara — usá el ingreso manual.");
      }
    };
    start();
    return () => {
      if (raf) cancelAnimationFrame(raf);
      if (stream) stream.getTracks().forEach((t) => t.stop());
    };
  }, []);

  return (
    <div className="px-4 pt-6 pb-28">
      <ToolHeader title="Escáner" onBack={onBack} />

      {!online && (
        <div className="flex items-center gap-2 bg-ink text-cream rounded-xl px-3 py-2 mb-3 border-2 border-ink">
          <IconWifiOff className="w-4 h-4 text-mustard flex-shrink-0" />
          <span className="font-body text-[11px] font-medium">Modo offline: los registros se guardan en el dispositivo</span>
        </div>
      )}

      <Card className="overflow-hidden mb-3 bg-ink border-ink relative aspect-[4/3]">
        <video ref={videoRef} className="w-full h-full object-cover opacity-90" muted playsInline />
        <canvas ref={canvasRef} className="hidden" />
        <div className="absolute inset-0 flex items-center justify-center pointer-events-none">
          <div className="w-40 h-40 border-2 border-mustard rounded-xl" />
        </div>
        {!scanning && (
          <div className="absolute inset-0 flex flex-col items-center justify-center gap-2 bg-ink/90">
            <IconCamera2 className="w-6 h-6 text-mustard" />
            <span className="font-body text-xs text-cream/70">{cameraError || "Iniciando cámara..."}</span>
          </div>
        )}
      </Card>

      <div className="flex gap-2 mb-4">
        <input
          value={manualCode}
          onChange={(e) => setManualCode(e.target.value)}
          placeholder="Ingresar código manual"
          className="flex-1 bg-white border-2 border-ink/10 rounded-xl px-3 py-2.5 font-body text-sm outline-none"
        />
        <Button variant="ghost" onClick={() => { if (manualCode) { addLog(manualCode, "Manual"); setManualCode(""); } }}>OK</Button>
      </div>

      <div className="grid grid-cols-2 gap-2 mb-4">
        <Button variant="accent" onClick={() => addLog(log[0]?.code || "—", "Carga vehículo")}>Registrar salida</Button>
        <Button variant="ghost" onClick={() => addLog(log[0]?.code || "—", "Devolución")}>Registrar devolución</Button>
      </div>

      <div className="font-body text-[10px] font-bold uppercase tracking-wide text-ink/40 mb-2">Registro</div>
      <div className="flex flex-col gap-2">
        {log.length === 0 && <p className="font-body text-xs text-ink/35 text-center py-6">Todavía no escaneaste nada</p>}
        {log.map((l) => (
          <Card key={l.id} className="p-3 flex items-center justify-between">
            <div>
              <div className="font-body text-sm font-semibold">{l.code}</div>
              <div className="font-body text-[10px] text-ink/40">{l.action} · {l.time}</div>
            </div>
            <div className="flex flex-col items-end gap-1">
              <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full border ${l.action === "Devolución" ? "bg-low/10 text-low border-low/30" : "bg-ok/10 text-ok border-ok/30"}`}>
                {l.action === "Devolución" ? "Revisar" : "OK"}
              </span>
              <span className={`text-[9px] font-semibold ${l.synced ? "text-ink/30" : "text-mustardDark"}`}>
                {l.synced ? "Sincronizado" : "Pendiente de sync"}
              </span>
            </div>
          </Card>
        ))}
      </div>
    </div>
  );
};

const SignaturePad = ({ onSign, signed }) => {
  const canvasRef = useRef(null);
  const drawing = useRef(false);

  const pos = (e, canvas) => {
    const rect = canvas.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return { x: p.clientX - rect.left, y: p.clientY - rect.top };
  };

  const start = (e) => { drawing.current = true; draw(e); };
  const end = () => { drawing.current = false; };
  const draw = (e) => {
    if (!drawing.current) return;
    const canvas = canvasRef.current;
    const ctx = canvas.getContext("2d");
    const { x, y } = pos(e, canvas);
    ctx.fillStyle = "#181712";
    ctx.beginPath();
    ctx.arc(x, y, 1.6, 0, Math.PI * 2);
    ctx.fill();
  };
  const clear = () => {
    const canvas = canvasRef.current;
    canvas.getContext("2d").clearRect(0, 0, canvas.width, canvas.height);
  };

  return (
    <div>
      <canvas
        ref={canvasRef}
        width={340}
        height={140}
        className="w-full bg-cream border-2 border-dashed border-ink/30 rounded-xl touch-none"
        onMouseDown={start} onMouseUp={end} onMouseLeave={end} onMouseMove={draw}
        onTouchStart={start} onTouchEnd={end} onTouchMove={draw}
      />
      <div className="flex gap-2 mt-2">
        <Button variant="ghost" className="flex-1" onClick={clear}>Limpiar firma</Button>
        <Button variant="accent" className="flex-1" onClick={() => onSign(canvasRef.current.toDataURL())}>Firmar contrato</Button>
      </div>
    </div>
  );
};

const BundleScreen = ({ onBack, onAddBundle }) => {
  const [carpa, setCarpa] = useState("c0");
  const [sillas, setSillas] = useState("s0");
  const [luz, setLuz] = useState("l0");

  const chosen = [
    BUNDLE_OPTIONS.carpa.find((o) => o.id === carpa),
    BUNDLE_OPTIONS.sillas.find((o) => o.id === sillas),
    BUNDLE_OPTIONS.luz.find((o) => o.id === luz),
  ];
  const activeCount = chosen.filter((c) => c.price > 0).length;
  const rawTotal = chosen.reduce((a, c) => a + c.price, 0);
  const discountPct = activeCount >= 3 ? 10 : activeCount === 2 ? 5 : 0;
  const discount = Math.round((rawTotal * discountPct) / 100);
  const finalTotal = rawTotal - discount;

  const Group = ({ title, options, value, onChange }) => (
    <div className="mb-4">
      <div className="font-body text-[10px] font-bold uppercase tracking-wide text-ink/40 mb-1.5">{title}</div>
      <div className="flex flex-col gap-2">
        {options.map((o) => (
          <button key={o.id} onClick={() => onChange(o.id)} className="w-full text-left">
            <Card className={`p-3 flex items-center justify-between ${value === o.id ? "bg-mustard/20 border-ink" : ""}`}>
              <span className="font-body text-sm font-medium">{o.label}</span>
              <div className="flex items-center gap-2">
                <span className="font-display font-bold text-sm">{o.price > 0 ? fmt(o.price) : "—"}</span>
                <span className={`w-4 h-4 rounded-full border-2 border-ink flex-shrink-0 ${value === o.id ? "bg-ink" : "bg-white"}`} />
              </div>
            </Card>
          </button>
        ))}
      </div>
    </div>
  );

  return (
    <div className="px-4 pt-6 pb-28">
      <ToolHeader title="Armá tu paquete" onBack={onBack} />
      <Group title="Carpa" options={BUNDLE_OPTIONS.carpa} value={carpa} onChange={setCarpa} />
      <Group title="Sillas" options={BUNDLE_OPTIONS.sillas} value={sillas} onChange={setSillas} />
      <Group title="Iluminación" options={BUNDLE_OPTIONS.luz} value={luz} onChange={setLuz} />

      <Card className="p-4 bg-ink border-ink">
        <div className="flex justify-between font-body text-xs text-cream/60 py-1">
          <span>Subtotal ({activeCount} componentes)</span><span>{fmt(rawTotal)}</span>
        </div>
        {discountPct > 0 && (
          <div className="flex justify-between font-body text-xs text-mustard py-1">
            <span>Descuento por volumen -{discountPct}%</span><span>-{fmt(discount)}</span>
          </div>
        )}
        <div className="flex justify-between font-display font-extrabold text-base text-mustard pt-2 mt-1 border-t border-dashed border-cream/20">
          <span>Total del paquete</span><span>{fmt(finalTotal)}</span>
        </div>
      </Card>

      <Button
        variant="accent"
        className="w-full mt-4"
        onClick={() => {
          if (activeCount === 0) return;
          onAddBundle({
            id: Date.now(),
            name: `Paquete a medida (${chosen.filter((c) => c.price > 0).map((c) => c.label).join(" + ")})`,
            price: finalTotal,
          });
          onBack();
        }}
      >
        Agregar paquete al carrito
      </Button>
    </div>
  );
};

/* ---------------- SCREEN: CARRITO / VENTAS ---------------- */
const DISCOUNT_PRESETS = [
  { id: "none", label: "Sin descuento", type: "percent", value: 0 },
  { id: "freq", label: "Cliente frecuente", type: "percent", value: 10 },
  { id: "grande", label: "Evento grande", type: "percent", value: 15 },
  { id: "custom", label: "Personalizado", type: "custom", value: 0 },
];

const CartScreen = ({ cart, onRemove, onClose, flash, onConfirmSale }) => {
  const [mode, setMode] = useState("total"); // total | seña
  const [preset, setPreset] = useState("none");
  const [customType, setCustomType] = useState("percent"); // percent | fixed
  const [customValue, setCustomValue] = useState("");
  const [client, setClient] = useState("");
  const [confirming, setConfirming] = useState(false);
  const [submitting, setSubmitting] = useState(false);
  const [confirmed, setConfirmed] = useState(false);

  const subtotal = cart.reduce((a, i) => a + i.price * i.qty, 0);

  const discountAmount = useMemo(() => {
    if (preset === "custom") {
      const v = Number(customValue) || 0;
      return customType === "percent" ? Math.round((subtotal * v) / 100) : v;
    }
    const p = DISCOUNT_PRESETS.find((d) => d.id === preset);
    if (!p || p.value === 0) return 0;
    return Math.round((subtotal * p.value) / 100);
  }, [preset, customType, customValue, subtotal]);

  const discountedTotal = Math.max(subtotal - discountAmount, 0);
  const amountNow = mode === "seña" ? Math.round(discountedTotal * 0.5) : discountedTotal;
  const pending = mode === "seña" ? discountedTotal - amountNow : 0;

  const ticketText = () => {
    const lines = cart.map((i) => `${i.qty}x ${i.name} — ${fmt(i.price * i.qty)}`).join("\n");
    return `QUICK SALE — Resumen de compra\n\n${lines}\n\nSubtotal: ${fmt(subtotal)}${discountAmount > 0 ? `\nDescuento: -${fmt(discountAmount)}` : ""}\n${mode === "seña" ? `Seña pagada: ${fmt(amountNow)}\nPendiente: ${fmt(pending)}` : `Total pagado: ${fmt(amountNow)}`}`;
  };

  const shareTicket = async () => {
    const text = ticketText();
    if (navigator.share) {
      try { await navigator.share({ title: "Ticket Quick Sale", text }); } catch (e) {}
    } else if (navigator.clipboard) {
      await navigator.clipboard.writeText(text);
      flash("Ticket copiado al portapapeles");
    }
  };

  const confirmSale = () => {
    if (submitting) return; // evita doble clic
    setSubmitting(true);
    setTimeout(() => {
      setSubmitting(false);
      setConfirming(false);
      setConfirmed(true);
      if (onConfirmSale) {
        onConfirmSale({
          id: "#" + Math.floor(1000 + Math.random() * 9000),
          client: client.trim() || "Sin nombre",
          items: cart,
          subtotal,
          discount: discountAmount,
          total: discountedTotal,
          mode,
          paid: amountNow,
          pending,
          date: new Date().toLocaleDateString("es-AR"),
          time: new Date().toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" }),
          status: mode === "seña" ? "Seña pagada" : "Pago total",
        });
      }
      flash("Venta registrada");
    }, 500);
  };

  return (
    <div className="px-4 pt-6 pb-28">
      <ScreenTitle
        action={
          onClose && (
            <button onClick={onClose} className="p-2">
              <IconX className="w-5 h-5 text-ink/50" />
            </button>
          )
        }
      >
        Carrito
      </ScreenTitle>

      {cart.length === 0 ? (
        <Card className="p-8 text-center">
          <p className="font-body text-sm text-ink/40">Todavía no agregaste nada</p>
        </Card>
      ) : (
        <>
          <Card className="p-4 flex flex-col divide-y-2 divide-dashed divide-ink/10">
            {cart.map((item) => (
              <div key={item.id} className="flex items-center justify-between py-2.5 first:pt-0 last:pb-0">
                <div>
                  <div className="font-body font-semibold text-sm text-ink">{item.name}</div>
                  <div className="font-body text-xs text-ink/40">Cant. {item.qty}</div>
                </div>
                <div className="flex items-center gap-3">
                  <span className="font-display font-bold text-sm">{fmt(item.price * item.qty)}</span>
                  <button onClick={() => onRemove(item.id)} className="text-ink/30">
                    <IconX className="w-4 h-4" />
                  </button>
                </div>
              </div>
            ))}
          </Card>

          <div className="mt-4">
            <label className="font-body text-[10px] font-bold uppercase tracking-wide text-ink/50">Cliente (opcional)</label>
            <input
              value={client}
              onChange={(e) => setClient(e.target.value)}
              placeholder="Nombre del cliente / evento"
              className="mt-1 w-full bg-cream border-2 border-ink/10 rounded-xl px-3 py-2.5 font-body text-sm outline-none"
            />
          </div>

          <div className="mt-4">
            <label className="font-body text-[10px] font-bold uppercase tracking-wide text-ink/50 flex items-center gap-1">
              <IconTag className="w-3 h-3" /> Descuento por cliente / volumen
            </label>
            <div className="flex gap-1.5 mt-1.5 overflow-x-auto no-scrollbar">
              {DISCOUNT_PRESETS.map((d) => (
                <Chip key={d.id} active={preset === d.id} onClick={() => setPreset(d.id)}>
                  {d.label}{d.type === "percent" && d.value > 0 ? ` -${d.value}%` : ""}
                </Chip>
              ))}
            </div>
            {preset === "custom" && (
              <div className="flex gap-2 mt-2">
                <div className="flex border-2 border-ink rounded-lg overflow-hidden">

          )}
        </>
      )}

      {confirming && (
        <div className="fixed inset-0 z-40 flex items-end sm:items-center justify-center p-4 bg-ink/40" onClick={() => !submitting && setConfirming(false)}>
          <Card className="w-full max-w-sm p-5" onClick={(e) => e.stopPropagation()}>

              <Button variant="ghost" className="flex-1" onClick={() => setConfirming(false)} disabled={submitting}>Cancelar</Button>
              <Button variant="accent" className="flex-1" onClick={confirmSale} disabled={submitting}>
                {submitting ? "Procesando..." : "Confirmar"}
              </Button>
            </div>
          </Card>
        </div>
      )}
    </div>
  );
};

/* ---------------- PEDIDOS (historial de ventas) ---------------- */
const PedidosScreen = ({ orders, setOrders, onOpenCart, cartCount }) => {

  const [filter, setFilter] = useState("todos");

  const updateFulfillment = (id, fulfillment) => {
    setOrders((prev) => prev.map((o) => (o.id === id ? { ...o, fulfillment } : o)));
    setSelected((s) => (s ? { ...s, fulfillment } : s));
  };

  const filtered = orders.filter((o) => {
    if (filter === "todos") return true;
    if (filter === "entregar") return (o.fulfillment || "Pendiente de entrega") === "Pendiente de entrega";
    if (filter === "devolver") return o.fulfillment === "Entregado";

  return (
    <div className="px-4 pt-6 pb-28">
      <ScreenTitle
        action={
          <button onClick={onOpenCart} className="relative bg-ink rounded-xl p-2">

              <span className="absolute -top-1.5 -right-1.5 bg-mustard text-ink text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center border border-ink">
                {cartCount}

        <Card className="p-4 mb-4 bg-ink border-ink">
          <div className="flex justify-between font-body text-xs text-cream/60">
            <span>Cobrado hoy</span><span className="font-display font-bold text-mustard text-sm">{fmt(totalHoy)}</span>
          </div>
          <div className="flex justify-between font-body text-xs text-cream/60 mt-1">
            <span>Pedidos</span><span>{orders.length}</span>
          </div>
        </Card>
      )}

      {orders.length > 0 && (
        <div className="flex gap-2 mb-4 overflow-x-auto no-scrollbar">
          <Chip active={filter === "todos"} onClick={() => setFilter("todos")}>Todos</Chip>

              <Card className="p-3.5 flex items-center justify-between">
                <div>

                  <div className="font-body text-[11px] text-ink/40 mt-0.5">{o.id} · {o.date} {o.time}</div>
                  <span className={`inline-block mt-1.5 text-[9px] font-semibold px-2 py-0.5 rounded-full border ${
                    (o.fulfillment || "Pendiente de entrega") === "Devuelto" ? "bg-ok/10 text-ok border-ok/30" :
                    o.fulfillment === "Entregado" ? "bg-mustard/15 text-ink/70 border-mustard/40" : "bg-ink/5 text-ink/50 border-ink/15"

        </div>

  );

/* ---------------- FICHAJE DE TRABAJADORES ---------------- */
const WORKERS = ["Marcos Ríos", "Lucía Paz", "Iván Soto"];

const FichajeScreen = ({ onBack, flash }) => {
  const [worker, setWorker] = useState(WORKERS[0]);
  const [log, setLog] = useState([]);
  const [locating, setLocating] = useState(false);
  const [error, setError] = useState("");

  const lastEntry = [...log].reverse().find((l) => l.worker === worker);
  const isIn = lastEntry?.type === "Entrada";

  const doFichaje = (type) => {
    setError("");
    if (!navigator.geolocation) {
      setError("Este dispositivo no soporta geolocalización.");
      return;
    }
    setLocating(true);
    navigator.geolocation.getCurrentPosition(
      (pos) => {
        const { latitude, longitude, accuracy } = pos.coords;
        setLog((prev) => [
          {
            id: Date.now(),
            worker,
            type,
            date: new Date().toLocaleDateString("es-AR"),
            time: new Date().toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" }),
            lat: latitude.toFixed(5),
            lng: longitude.toFixed(5),
            accuracy: Math.round(accuracy),
          },
          ...prev,
        ]);
        setLocating(false);
        flash(`${type} registrada · ${worker}`);
      },
      () => {
        setLocating(false);
        setError("No se pudo obtener tu ubicación. Activá el GPS y los permisos de ubicación para fichar.");
      },
      { enableHighAccuracy: true, timeout: 10000 }
    );
  };

  return (
    <div className="px-4 pt-6 pb-28">
      <ToolHeader title="Fichaje" onBack={onBack} />

      <Card className="p-4 mb-5 flex flex-col gap-3">
        <div>
          <label className="font-body text-[10px] font-bold uppercase tracking-wide text-ink/50">Trabajador</label>
          <select
            value={worker}
            onChange={(e) => setWorker(e.target.value)}
            className="mt-1 w-full bg-cream border-2 border-ink/10 rounded-xl px-3 py-2.5 font-body text-sm outline-none"
          >
            {WORKERS.map((w) => <option key={w}>{w}</option>)}
          </select>
        </div>

        <span
          className={`inline-block self-start text-[10px] font-semibold px-2 py-0.5 rounded-full border ${
            isIn ? "bg-ok/10 text-ok border-ok/30" : "bg-ink/5 text-ink/50 border-ink/15"
          }`}
        >
          {isIn ? "Dentro del turno" : "Fuera de turno"}
        </span>

        {error && (
          <div className="bg-low/10 border border-low/30 text-low text-[11px] font-medium rounded-lg p-2.5 leading-relaxed">
            {error}
          </div>
        )}

        <div className="grid grid-cols-2 gap-2 mt-1">
          <Button
            variant={isIn ? "ghost" : "accent"}
            disabled={isIn || locating}
            onClick={() => doFichaje("Entrada")}
            className={isIn || locating ? "opacity-50" : ""}
          >
            {locating ? "Ubicando..." : "Fichar entrada"}
          </Button>
          <Button
            variant={!isIn ? "ghost" : "accent"}
            disabled={!isIn || locating}
            onClick={() => doFichaje("Salida")}
            className={!isIn || locating ? "opacity-50" : ""}
          >
            {locating ? "Ubicando..." : "Fichar salida"}
          </Button>
        </div>
        <p className="font-body text-[10px] text-ink/40 text-center leading-relaxed">
          Necesitamos tu ubicación en el momento del fichaje para confirmar que estás en el evento.
        </p>
      </Card>

      <div className="font-body text-[10px] font-bold uppercase tracking-wide text-ink/40 mb-2">Registro de fichajes</div>
      <div className="flex flex-col gap-2">
        {log.length === 0 && (
          <p className="font-body text-xs text-ink/35 text-center py-6">Todavía no hay fichajes registrados</p>
        )}
        {log.map((l) => (
          <Card key={l.id} className="p-3">
            <div className="flex items-center justify-between">
              <div>
                <div className="font-body text-sm font-semibold">{l.worker}</div>
                <div className="font-body text-[10px] text-ink/40">{l.date} · {l.time}</div>
              </div>
              <span className={`text-[10px] font-bold px-2 py-0.5 rounded-full border ${l.type === "Entrada" ? "bg-ok/10 text-ok border-ok/30" : "bg-ink/5 text-ink/60 border-ink/15"}`}>
                {l.type}
              </span>
            </div>
            <a
              href={`https://www.google.com/maps?q=${l.lat},${l.lng}`}
              target="_blank"
              rel="noreferrer"
              className="flex items-center gap-1.5 mt-2 pt-2 border-t border-dashed border-ink/10 font-body text-[10px] text-ink/45 underline"
            >
              <IconMapPin className="w-3 h-3" /> {l.lat}, {l.lng} (±{l.accuracy} m) · Ver en el mapa
            </a>
          </Card>
        ))}
      </div>
    </div>
  );
};

/* ---------------- CUADRE DE CAJA / ARQUEO ---------------- */
const ArqueoScreen = ({ onBack, flash }) => {
  const ventasSistema = 54000;
  const [efectivo, setEfectivo] = useState("");
  const [transferencia, setTransferencia] = useState("");
  const [tarjeta, setTarjeta] = useState("");
  const [history, setHistory] = useState([]);
  const [closed, setClosed] = useState(false);

  const contado = (Number(efectivo) || 0) + (Number(transferencia) || 0) + (Number(tarjeta) || 0);
  const diferencia = contado - ventasSistema;
  const cuadra = efectivo !== "" && Math.abs(diferencia) === 0;

  const cerrarCaja = () => {
    setHistory((prev) => [{ id: Date.now(), date: new Date().toLocaleDateString("es-AR"), ventasSistema, contado, diferencia }, ...prev]);
    setClosed(true);
    flash(diferencia === 0 ? "Caja cerrada — cuadra perfecto" : `Caja cerrada — diferencia de ${fmt(diferencia)}`);
  };

  return (
    <div className="px-4 pt-6 pb-28">
      <ToolHeader title="Cuadre de caja" onBack={onBack} />

      <Card className="p-4 mb-4 bg-ink border-ink">
        <div className="flex justify-between font-body text-xs text-cream/60 py-1">
          <span>Ventas registradas por el sistema</span><span>{fmt(ventasSistema)}</span>
        </div>
      </Card>

      <div className="flex flex-col gap-3 mb-4">
        <div>
          <label className="font-body text-[10px] font-bold uppercase tracking-wide text-ink/50">Efectivo contado</label>
          <input value={efectivo} onChange={(e) => setEfectivo(e.target.value)} type="number" placeholder="$0" className="mt-1 w-full bg-cream border-2 border-ink/10 rounded-xl px-3 py-2.5 font-body text-sm outline-none" />
        </div>
        <div>
          <label className="font-body text-[10px] font-bold uppercase tracking-wide text-ink/50">Transferencias contadas</label>
          <input value={transferencia} onChange={(e) => setTransferencia(e.target.value)} type="number" placeholder="$0" className="mt-1 w-full bg-cream border-2 border-ink/10 rounded-xl px-3 py-2.5 font-body text-sm outline-none" />
        </div>
        <div>
          <label className="font-body text-[10px] font-bold uppercase tracking-wide text-ink/50">Tarjeta contada</label>
          <input value={tarjeta} onChange={(e) => setTarjeta(e.target.value)} type="number" placeholder="$0" className="mt-1 w-full bg-cream border-2 border-ink/10 rounded-xl px-3 py-2.5 font-body text-sm outline-none" />
        </div>
      </div>

      <Card className={`p-4 mb-4 ${diferencia === 0 ? "bg-ok/5 border-ok/30" : "bg-low/5 border-low/30"}`}>
        <div className="flex justify-between font-body text-xs text-ink/60 py-1"><span>Total contado</span><span className="font-semibold">{fmt(contado)}</span></div>
        <div className="flex justify-between font-display font-extrabold text-base pt-2 mt-1 border-t border-dashed border-ink/10">
          <span className={diferencia === 0 ? "text-ok" : "text-low"}>Diferencia</span>
          <span className={diferencia === 0 ? "text-ok" : "text-low"}>{diferencia > 0 ? "+" : ""}{fmt(diferencia)}</span>
        </div>
        {cuadra && <div className="mt-1.5 text-[11px] font-semibold text-ok">✓ Cuadra perfecto</div>}
      </Card>

      {closed && (
        <div className="bg-ok/10 border border-ok/30 text-ok text-xs font-semibold rounded-lg p-2.5 mb-3 text-center">
          Caja cerrada hoy — volvé a abrir mañana para el próximo arqueo
        </div>
      )}

      <Button variant={closed ? "ghost" : "accent"} className="w-full" onClick={cerrarCaja} disabled={closed}>
        {closed ? "Caja ya cerrada" : "Cerrar caja del día"}
      </Button>

      {history.length > 0 && (
        <>
          <div className="font-body text-[10px] font-bold uppercase tracking-wide text-ink/40 mt-6 mb-2">Historial de arqueos</div>
          <div className="flex flex-col gap-2">
            {history.map((h) => (
              <Card key={h.id} className="p-3 flex items-center justify-between">
                <span className="font-body text-sm font-semibold">{h.date}</span>
                <span className={`font-display font-bold text-sm ${h.diferencia === 0 ? "text-ok" : "text-low"}`}>
                  {h.diferencia > 0 ? "+" : ""}{fmt(h.diferencia)}
                </span>
              </Card>
            ))}
          </div>
        </>
      )}
    </div>
  );
};

/* ---------------- ANULACIONES Y DEVOLUCIONES ---------------- */

  const [note, setNote] = useState("");

  const register = () => {
    const item = inventory.find((i) => i.id === Number(itemId));
    setLog((prev) => [
      { id: Date.now(), item: item?.name, qty: Number(qty), reason, note, time: new Date().toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" }), date: new Date().toLocaleDateString("es-AR") },
      ...prev,
    ]);

    <div className="px-4 pt-6 pb-28">
      <ToolHeader title="Anulaciones" onBack={onBack} />

      <Card className="p-3 mb-4 flex flex-col gap-2.5 bg-cream">
        <select value={itemId} onChange={(e) => setItemId(e.target.value)} className="bg-white border-2 border-ink/10 rounded-lg px-2.5 py-2 font-body text-sm outline-none">
          {inventory.map((i) => <option key={i.id} value={i.id}>{i.name}</option>)}

        <div className="flex gap-2">

          <select value={reason} onChange={(e) => setReason(e.target.value)} className="flex-1 bg-white border-2 border-ink/10 rounded-lg px-2.5 py-2 font-body text-sm outline-none">
            {RETURN_REASONS.map((r) => <option key={r}>{r}</option>)}
          </select>
        </div>
        <input value={note} onChange={(e) => setNote(e.target.value)} placeholder="Nota adicional (opcional)" className="bg-white border-2 border-ink/10 rounded-lg px-2.5 py-2 font-body text-sm outline-none" />
        <Button variant="accent" onClick={register}>Registrar anulación</Button>
      </Card>

      <div className="font-body text-[10px] font-bold uppercase tracking-wide text-ink/40 mb-2">Bitácora</div>
      <div className="flex flex-col gap-2">
        {log.length === 0 && <p className="font-body text-xs text-ink/35 text-center py-6">Sin anulaciones registradas</p>}
        {log.map((l) => (
          <Card key={l.id} className="p-3">
            <div className="flex items-center justify-between">
              <span className="font-body text-sm font-semibold">{l.item} ×{l.qty}</span>
              <span className="font-body text-[10px] text-ink/40">{l.date} · {l.time}</span>
            </div>
            <span className="inline-block mt-1.5 text-[10px] font-semibold px-2 py-0.5 rounded-full border bg-low/10 text-low border-low/30">{l.reason}</span>
            {l.note && <p className="font-body text-xs text-ink/50 mt-1.5">{l.note}</p>}
          </Card>
        ))}
      </div>
    </div>
  );
};

/* ---------------- NOTIFICACIONES ---------------- */
const NotificacionesScreen = ({ inventory, reservations, orders, onBack, navigate }) => {
  const critical = inventory
    .filter((i) => i.low)
    .map((i) => ({ ...i, nextReservation: reservations.filter((r) => r.itemId === i.id).sort((a, b) => (a.from > b.from ? 1 : -1))[0] }))
    .filter((i) => i.nextReservation);
  const pendingOrders = orders.filter((o) => o.pending > 0);
  const nextReservation = [...reservations].sort((a, b) => (a.from > b.from ? 1 : -1))[0];

  const items = [
    ...critical.map((i) => ({ tone: "low", text: `Stock crítico: ${i.name} — reservado ${fmtDate(i.nextReservation.from)}`, go: "inventario" })),
    ...pendingOrders.map((o) => ({ tone: "warn", text: `Seña pendiente de ${o.client} · ${o.id}`, go: "ventas" })),
    ...(nextReservation ? [{ tone: "ok", text: `Próximo evento: ${nextReservation.client} (${fmtDate(nextReservation.from)})`, go: null }] : []),
  ];

  return (
    <div className="px-4 pt-6 pb-28">
      <ToolHeader title="Notificaciones" onBack={onBack} />
      {items.length === 0 ? (
        <Card className="p-8 text-center"><p className="font-body text-sm text-ink/40">Sin novedades por ahora</p></Card>
      ) : (
        <div className="flex flex-col gap-2">
          {items.map((it, idx) => (
            <button key={idx} onClick={() => { if (it.go) { navigate(it.go); onBack(); } }} className="text-left">
              <Card className="p-3 flex items-center gap-3">
                <span className={`w-2 h-2 rounded-full flex-shrink-0 ${it.tone === "low" ? "bg-low" : it.tone === "warn" ? "bg-mustard" : "bg-ok"}`} />
                <span className="font-body text-sm text-ink/80">{it.text}</span>
              </Card>
            </button>
          ))}
        </div>
      )}
    </div>
  );
};

/* ---------------- BORRADORES DE PEDIDO ---------------- */
const INITIAL_DRAFTS = [];
const BorradoresScreen = ({ onBack, flash }) => {
  const [drafts, setDrafts] = useState(INITIAL_DRAFTS);
  const [client, setClient] = useState("");
  const [itemName, setItemName] = useState("");
  const [itemPrice, setItemPrice] = useState("");
  const [lines, setLines] = useState([]);

  const addLine = () => {
    if (!itemName.trim() || !itemPrice) return;
    setLines((p) => [...p, { id: Date.now(), name: itemName, price: Number(itemPrice) }]);
    setItemName(""); setItemPrice("");
  };
  const removeLine = (id) => setLines((p) => p.filter((l) => l.id !== id));
  const total = lines.reduce((a, l) => a + l.price, 0);

  const saveDraft = () => {
    if (!client.trim() || lines.length === 0) return;
    setDrafts((p) => [{ id: Date.now(), client, lines, total, date: new Date().toLocaleDateString("es-AR") }, ...p]);
    setClient(""); setLines([]);
    flash("Presupuesto guardado como borrador");
  };

  const shareDraft = async (d) => {
    const text = `Presupuesto Quick Sale — ${d.client}\n\n${d.lines.map((l) => `${l.name} — ${fmt(l.price)}`).join("\n")}\n\nTotal: ${fmt(d.total)}`;
    if (navigator.share) { try { await navigator.share({ title: "Presupuesto", text }); } catch (e) {} }
    else if (navigator.clipboard) { await navigator.clipboard.writeText(text); flash("Presupuesto copiado"); }
  };

  return (
    <div className="px-4 pt-6 pb-28">
      <ToolHeader title="Borradores" onBack={onBack} />
      <Card className="p-3 mb-4 flex flex-col gap-2.5 bg-cream">
        <input value={client} onChange={(e) => setClient(e.target.value)} placeholder="Cliente / evento" className="bg-white border-2 border-ink/10 rounded-lg px-2.5 py-2 font-body text-sm outline-none" />
        <div className="flex gap-2">
          <input value={itemName} onChange={(e) => setItemName(e.target.value)} placeholder="Artículo o servicio" className="flex-1 bg-white border-2 border-ink/10 rounded-lg px-2.5 py-2 font-body text-sm outline-none" />
          <input value={itemPrice} onChange={(e) => setItemPrice(e.target.value)} type="number" placeholder="$" className="w-20 bg-white border-2 border-ink/10 rounded-lg px-2.5 py-2 font-body text-sm outline-none" />
        </div>
        <Button variant="ghost" onClick={addLine}>+ Agregar línea</Button>
        {lines.length > 0 && (
          <div className="flex flex-col divide-y divide-dashed divide-ink/10">
            {lines.map((l) => (
              <div key={l.id} className="flex justify-between items-center py-1.5 font-body text-sm">
                <span>{l.name}</span>
                <div className="flex items-center gap-2">
                  <span className="font-semibold">{fmt(l.price)}</span>
                  <button onClick={() => removeLine(l.id)}><IconX className="w-3.5 h-3.5 text-ink/30" /></button>
                </div>
              </div>
            ))}
            <div className="flex justify-between pt-1.5 font-display font-bold text-sm"><span>Total</span><span>{fmt(total)}</span></div>
          </div>
        )}
        <Button variant="accent" onClick={saveDraft}>Guardar borrador</Button>
      </Card>

      <div className="font-body text-[10px] font-bold uppercase tracking-wide text-ink/40 mb-2">Presupuestos guardados</div>
      <div className="flex flex-col gap-2">
        {drafts.length === 0 && <p className="font-body text-xs text-ink/35 text-center py-6">Sin borradores todavía</p>}
        {drafts.map((d) => (
          <Card key={d.id} className="p-3.5">
            <div className="flex items-center justify-between">
              <div>
                <div className="font-body text-sm font-semibold">{d.client}</div>
                <div className="font-body text-[10px] text-ink/40">{d.date} · {d.lines.length} línea{d.lines.length > 1 ? "s" : ""}</div>
              </div>
              <span className="font-display font-bold text-sm">{fmt(d.total)}</span>
            </div>
            <Button variant="ghost" className="w-full mt-2 flex items-center justify-center gap-2" onClick={() => shareDraft(d)}>
              <IconShare className="w-3.5 h-3.5" /> Compartir presupuesto
            </Button>
          </Card>
        ))}
      </div>
    </div>
  );
};

/* ---------------- ANALÍTICAS ---------------- */
const AnaliticasScreen = ({ orders, onBack }) => {
  const weekData = [
    { d: "Lun", v: 18000 }, { d: "Mar", v: 24000 }, { d: "Mié", v: 15000 }, { d: "Jue", v: 32000 },
    { d: "Vie", v: 41000 }, { d: "Sáb", v: orders.reduce((a, o) => a + o.paid, 0) || 54000 }, { d: "Dom", v: 29000 },
  ];
  const max = Math.max(...weekData.map((d) => d.v));

  const productTotals = {};
  orders.forEach((o) => o.items.forEach((i) => {
    productTotals[i.name] = productTotals[i.name] || { qty: 0, revenue: 0 };
    productTotals[i.name].qty += i.qty;
    productTotals[i.name].revenue += i.price * i.qty;
  }));
  const top = Object.entries(productTotals).sort((a, b) => b[1].revenue - a[1].revenue).slice(0, 5);

  return (
    <div className="px-4 pt-6 pb-28">
      <ToolHeader title="Analíticas" onBack={onBack} />

      <div className="font-body text-[10px] font-bold uppercase tracking-wide text-ink/40 mb-2">Ventas de la semana</div>
      <Card className="p-4 mb-5">
        <div className="flex items-end gap-2 h-32">
          {weekData.map((d) => (
            <div key={d.d} className="flex-1 flex flex-col items-center gap-1.5 h-full justify-end">
              <div className="w-full bg-ink rounded-t-md" style={{ height: `${(d.v / max) * 100}%` }} />
              <span className="font-body text-[9px] font-semibold text-ink/45">{d.d}</span>
            </div>
          ))}
        </div>
      </Card>

      <div className="font-body text-[10px] font-bold uppercase tracking-wide text-ink/40 mb-2">Más vendidos (pedidos registrados)</div>
      {top.length === 0 ? (
        <Card className="p-6 text-center"><p className="font-body text-xs text-ink/40">Confirmá ventas para ver el ranking acá</p></Card>
      ) : (
        <div className="flex flex-col gap-2">
          {top.map(([name, d]) => (
            <Card key={name} className="p-3 flex items-center justify-between">
              <div>
                <div className="font-body text-sm font-semibold">{name}</div>
                <div className="font-body text-[10px] text-ink/40">{d.qty} unidades</div>
              </div>
              <span className="font-display font-bold text-sm">{fmt(d.revenue)}</span>
            </Card>
          ))}
        </div>
      )}
    </div>
  );
};

/* ---------------- AJUSTES ---------------- */
const AjustesScreen = ({ onBack, flash }) => {
  const [deposito, setDeposito] = useState(50);
  const [moneda, setMoneda] = useState("ARS");
  const [notif, setNotif] = useState({ stockCritico: true, senasVencidas: true, nuevoPedido: false });

  const save = () => flash("Ajustes guardados");

  return (
    <div className="px-4 pt-6 pb-28">
      <ToolHeader title="Ajustes" onBack={onBack} />

      <Card className="p-4 mb-4 flex flex-col gap-4">
        <div>
          <label className="font-body text-[10px] font-bold uppercase tracking-wide text-ink/50">Seña por defecto: {deposito}%</label>
          <input type="range" min="0" max="100" step="5" value={deposito} onChange={(e) => setDeposito(e.target.value)} className="w-full mt-1.5 accent-ink" />
        </div>
        <div>
          <label className="font-body text-[10px] font-bold uppercase tracking-wide text-ink/50">Moneda</label>
          <select value={moneda} onChange={(e) => setMoneda(e.target.value)} className="mt-1 w-full bg-cream border-2 border-ink/10 rounded-xl px-3 py-2.5 font-body text-sm outline-none">
            <option value="ARS">Peso argentino (ARS)</option>
            <option value="EUR">Euro (EUR)</option>
            <option value="USD">Dólar (USD)</option>
          </select>
        </div>
      </Card>

      <div className="font-body text-[10px] font-bold uppercase tracking-wide text-ink/40 mb-2">Notificaciones</div>
      <Card className="p-1 mb-4">
        {[
          ["stockCritico", "Stock crítico antes de un evento"],
          ["senasVencidas", "Señas pendientes por vencer"],
          ["nuevoPedido", "Nuevo pedido recibido"],
        ].map(([k, label]) => (
          <label key={k} className="flex items-center justify-between px-3 py-2.5 border-b border-ink/5 last:border-0">
            <span className="font-body text-sm text-ink">{label}</span>
            <input type="checkbox" checked={notif[k]} onChange={() => setNotif((n) => ({ ...n, [k]: !n[k] }))} className="w-4 h-4 accent-ink" />
          </label>
        ))}
      </Card>

      <Button variant="accent" className="w-full" onClick={save}>Guardar ajustes</Button>
    </div>
  );
};

/* ---------------- APP ---------------- */
function App() {
  const [tab, setTab] = useState("inicio");
  const [inventory, setInventory] = useState(INITIAL_INVENTORY);
  const [reservations, setReservations] = useState(INITIAL_RESERVATIONS);
  const [orders, setOrders] = useState([]);
  const [showForm, setShowForm] = useState(false);
  const [showCart, setShowCart] = useState(false);
  const [tool, setTool] = useState(null);
  const [cart, setCart] = useState([]);
  const [toast, setToast] = useState(null);
  const [online, setOnline] = useState(navigator.onLine);
  const [scanLog, setScanLog] = useState([]);

  const flash = (msg) => {
    setToast(msg);
    setTimeout(() => setToast(null), 1800);
  };

  useEffect(() => {
    const goOnline = () => {
      setOnline(true);
      setScanLog((prev) => {
        const pending = prev.filter((l) => !l.synced).length;
        if (pending > 0) flash(`${pending} registro${pending > 1 ? "s" : ""} sincronizado${pending > 1 ? "s" : ""}`);
        return prev.map((l) => ({ ...l, synced: true }));
      });
    };
    const goOffline = () => setOnline(false);
    window.addEventListener("online", goOnline);
    window.addEventListener("offline", goOffline);
    return () => {
      window.removeEventListener("online", goOnline);
      window.removeEventListener("offline", goOffline);
    };
  }, []);

  const addScanLog = (code, action) => {
    setScanLog((prev) => [
      { id: Date.now(), code, action, synced: online, time: new Date().toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" }) },
      ...prev,
    ]);
  };

  const handleCreate = (product) => {
    setInventory((prev) => [product, ...prev]);
    setShowForm(false);
    flash(product.draft ? "Guardado como borrador" : "Listo, ya está en tu inventario");
  };

  const addToCart = (p) => {
    setCart((prev) => {
      const existing = prev.find((i) => i.id === p.id);
      if (existing) return prev.map((i) => (i.id === p.id ? { ...i, qty: i.qty + 1 } : i));
      return [...prev, { ...p, qty: 1 }];
    });
    flash(`${p.name} agregado`);
  };

  const removeFromCart = (id) => setCart((prev) => prev.filter((i) => i.id !== id));
  const cartCount = cart.reduce((a, i) => a + i.qty, 0);

  const addReservation = (r) => {
    setReservations((prev) => [...prev, r]);
    flash(`Bloqueado: ${r.itemName} · ${fmtDate(r.from)}–${fmtDate(r.to)} SEP`);
  };

  const confirmSale = (order) => {
    setOrders((prev) => [order, ...prev]);
    setCart([]);
  };

  const navigate = (key) => { setTool(null); setShowCart(false); setTab(key); };

  let screen;
  if (tool) {
    const back = () => setTool(null);
    if (tool === "calendario") screen = <CalendarioScreen inventory={inventory} reservations={reservations} onAddReservation={addReservation} onBack={back} />;
    else if (tool === "scanner") screen = <ScannerScreen inventory={inventory} onBack={back} online={online} log={scanLog} addLog={addScanLog} />;
    else if (tool === "portal") screen = <PortalScreen onBack={back} flash={flash} />;
    else if (tool === "staff") screen = <StaffScreen inventory={inventory} onBack={back} flash={flash} />;
    else if (tool === "docs") screen = <DocsScreen reservations={reservations} onBack={back} flash={flash} />;
    else if (tool === "clientes") screen = <ClientesScreen onBack={back} flash={flash} />;
    else if (tool === "gastos") screen = <GastosScreen onBack={back} flash={flash} />;
    else if (tool === "fichaje") screen = <FichajeScreen onBack={back} flash={flash} />;
    else if (tool === "arqueo") screen = <ArqueoScreen onBack={back} flash={flash} />;
    else if (tool === "anulaciones") screen = <AnulacionesScreen inventory={inventory} onBack={back} flash={flash} />;
    else if (tool === "bundle") screen = <BundleScreen onBack={back} onAddBundle={addToCart} />;
    else if (tool === "notificaciones") screen = <NotificacionesScreen inventory={inventory} reservations={reservations} orders={orders} onBack={back} navigate={navigate} />;
    else if (tool === "borradores") screen = <BorradoresScreen onBack={back} flash={flash} />;
    else if (tool === "analiticas") screen = <AnaliticasScreen orders={orders} onBack={back} />;
    else if (tool === "ajustes") screen = <AjustesScreen onBack={back} flash={flash} />;
  } else if (showForm) {
    screen = <AltaRapidaScreen onCreate={handleCreate} onClose={() => setShowForm(false)} />;
  } else if (showCart) {
    screen = <CartScreen cart={cart} onRemove={removeFromCart} onClose={() => setShowCart(false)} flash={flash} onConfirmSale={confirmSale} />;
  } else if (tab === "inicio") {
    screen = <InicioScreen inventory={inventory} reservations={reservations} orders={orders} onOpenTool={setTool} onOpenNotifications={() => setTool("notificaciones")} online={online} navigate={navigate} />;
  } else if (tab === "inventario") {
    screen = <InventarioScreen inventory={inventory} onOpenForm={() => setShowForm(true)} />;
  } else if (tab === "tienda") {
    screen = <TiendaScreen onAdd={addToCart} cartCount={cartCount} onOpenCart={() => setShowCart(true)} onOpenBundle={() => setTool("bundle")} />;
  } else if (tab === "ventas") {
    screen = <PedidosScreen orders={orders} setOrders={setOrders} cartCount={cartCount} onOpenCart={() => setShowCart(true)} />;
  }

  return (
    <div className="max-w-md mx-auto min-h-screen bg-[#E7E2D3] relative font-body">
      <div className="min-h-screen bg-cream">{screen}</div>

      {toast && (
        <div className="fixed bottom-24 left-1/2 -translate-x-1/2 max-w-[90%] bg-ink text-mustard font-body text-xs font-semibold px-4 py-2.5 rounded-full shadow-brut border-2 border-ink z-50">
          {toast}
        </div>
      )}

      {!showForm && !showCart && !tool && <BottomNav active={tab} onChange={setTab} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
