/* ---------------- TRANSFERENCIAS DE STOCK ---------------- */
const TransferenciasView = ({ inventory, updateLocation, flash }) => {
  const [transfers, setTransfers] = useState(TRANSFERS);
  const [showForm, setShowForm] = useState(false);
  const [itemId, setItemId] = useState(inventory[0]?.id);
  const [qty, setQty] = useState(1);
  const [from, setFrom] = useState(LOCATIONS[0]?.name || "");
  const [to, setTo] = useState(LOCATIONS[1]?.name || "");
  const [filter, setFilter] = useState("todos");
  const [query, setQuery] = useState("");

  const create = () => {
    const item = inventory.find((i) => i.id === Number(itemId));
    if (!from.trim() || !to.trim()) return;
    setTransfers((p) => [{ id: Date.now(), itemId: item?.id, item: item?.name, qty: Number(qty), from, to, status: "En tránsito", date: new Date().toLocaleDateString("es-AR") }, ...p]);
    setShowForm(false);
    flash("Transferencia creada");
  };

  const markDone = (id) => {
    const t = transfers.find((x) => x.id === id);
    setTransfers((p) => p.map((x) => (x.id === id ? { ...x, status: "Completada" } : x)));
    if (t?.itemId) {
      updateLocation(t.itemId, t.to);
      flash(`Transferencia completada — stock movido a ${t.to}`);
    } else {
      flash("Transferencia completada");
    }
  };

  const filtered = transfers.filter((t) => {
    const matchesFilter = filter === "todos" ? true : filter === "transito" ? t.status === "En tránsito" : t.status === "Completada";
    const matchesQuery = t.item.toLowerCase().includes(query.toLowerCase());
    return matchesFilter && matchesQuery;
  });

  const stats = {
    transito: transfers.filter((t) => t.status === "En tránsito").length,
    completadas: transfers.filter((t) => t.status === "Completada").length,
  };

  return (
    <div className="max-w-5xl">
      <div className="flex items-center justify-between mb-5">
        <h1 className="font-display font-extrabold text-2xl text-ink uppercase tracking-tight">Transferencias</h1>
        <Btn variant="primary" onClick={() => setShowForm((s) => !s)}>{showForm ? "Cancelar" : "+ Nueva transferencia"}</Btn>
      </div>

      <div className="grid grid-cols-2 gap-3 mb-5">
        <Panel className="p-3.5"><div className="font-display font-extrabold text-xl text-mustardDark">{stats.transito}</div><div className="font-body text-[11px] text-muted mt-0.5">En tránsito</div></Panel>
        <Panel className="p-3.5"><div className="font-display font-extrabold text-xl text-ok">{stats.completadas}</div><div className="font-body text-[11px] text-muted mt-0.5">Completadas</div></Panel>
      </div>

      {showForm && (
        <Panel className="p-4 mb-5 flex flex-wrap gap-3 items-end">
          <Field label="Producto">
            <select value={itemId} onChange={(e) => setItemId(e.target.value)} className={inputCls}>
              {inventory.map((i) => <option key={i.id} value={i.id}>{i.name}</option>)}
            </select>
          </Field>
          <Field label="Cantidad"><input value={qty} onChange={(e) => setQty(e.target.value)} type="number" min="1" className={`${inputCls} w-24`} /></Field>
          <Field label="Origen">
            <select value={from} onChange={(e) => setFrom(e.target.value)} className={inputCls}>
              {LOCATIONS.map((l) => <option key={l.id} value={l.name}>{l.name}</option>)}
            </select>
          </Field>
          <Field label="Destino">
            <select value={to} onChange={(e) => setTo(e.target.value)} className={inputCls}>
              {LOCATIONS.map((l) => <option key={l.id} value={l.name}>{l.name}</option>)}
            </select>
          </Field>
          <Btn variant="primary" onClick={create}>Crear</Btn>
        </Panel>
      )}

      <div className="flex items-center justify-between gap-3 mb-4 flex-wrap">
        <div className="flex gap-2">
          <Chip active={filter === "todos"} onClick={() => setFilter("todos")}>Todas</Chip>
          <Chip active={filter === "transito"} onClick={() => setFilter("transito")}>En tránsito</Chip>
          <Chip active={filter === "completadas"} onClick={() => setFilter("completadas")}>Completadas</Chip>
        </div>
        <div className="relative max-w-xs">
          <ISearch className="w-3.5 h-3.5 text-ink/35 absolute left-3 top-1/2 -translate-y-1/2" />
          <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Buscar producto..." className={`${inputCls} w-full pl-8`} />
        </div>
      </div>

      <Panel className="overflow-hidden">
        <table className="w-full text-left">
          <thead>
            <tr className="border-b border-black/10 bg-[#FAFAF7]">
              {["Producto", "Cantidad", "De → A", "Estado", ""].map((h) => (
                <th key={h} className="px-4 py-2.5 font-body text-xs font-semibold text-muted uppercase tracking-wide">{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {filtered.map((t) => (
              <tr key={t.id} className="border-b border-black/5 last:border-0">
                <td className="px-4 py-3 font-body text-sm font-semibold text-ink">{t.item}</td>
                <td className="px-4 py-3 font-body text-sm text-ink/55">{t.qty}</td>
                <td className="px-4 py-3 font-body text-sm text-ink/55">{t.from} → {t.to}</td>
                <td className="px-4 py-3">
                  <span className={`text-xs font-semibold px-2 py-1 rounded-full border ${t.status === "Completada" ? "bg-ok/10 text-ok border-ok/25" : "bg-mustard/15 text-ink/70 border-mustard/40"}`}>{t.status}</span>
                </td>
                <td className="px-4 py-3 text-right">
                  {t.status !== "Completada" && <Btn variant="outline" onClick={() => markDone(t.id)}>Marcar recibida</Btn>}
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </Panel>
    </div>
  );
};

const MarketsView = ({ flash }) => {
  const [markets, setMarkets] = useState(MARKETS.map((m) => ({ ...m, domain: `${m.name.toLowerCase().replace(/\s+/g, "-")}.quicksale.com`, language: "Español", rounding: "Sin redondeo" })));
  const [showForm, setShowForm] = useState(false);
  const [name, setName] = useState("");
  const [currency, setCurrency] = useState("USD");
  const [countries, setCountries] = useState("");
  const [query, setQuery] = useState("");
  const [editing, setEditing] = useState(null);

  const toggleStatus = (id) => {
    setMarkets((prev) => prev.map((m) => (m.id === id ? { ...m, status: m.status === "Activo" ? "Inactivo" : "Activo" } : m)));
  };

  const createFromSuggested = (s) => {
    setMarkets((prev) => [{ id: Date.now(), name: s.name, flag: s.flags, status: "Activo", currency: "USD", countries: s.countries, domain: `${s.name.toLowerCase().replace(/\s+/g, "-")}.quicksale.com`, language: "Español", rounding: "Sin redondeo" }, ...prev]);
    flash(`Mercado "${s.name}" creado`);
  };

  const createCustom = () => {
    if (!name.trim()) return;
    setMarkets((prev) => [{ id: Date.now(), name, flag: "🌐", status: "Activo", currency, countries: countries.split(",").map((c) => c.trim()).filter(Boolean), domain: `${name.toLowerCase().replace(/\s+/g, "-")}.quicksale.com`, language: "Español", rounding: "Sin redondeo" }, ...prev]);
    setName(""); setCountries(""); setShowForm(false);
    flash(`Mercado "${name}" creado`);
  };

  const saveMarket = () => {
    setMarkets((prev) => prev.map((m) => (m.id === editing.id ? editing : m)));
    flash(`Mercado "${editing.name}" actualizado`);
    setEditing(null);
  };

  const filteredMarkets = markets.filter((m) => m.name.toLowerCase().includes(query.toLowerCase()) || m.countries.some((c) => c.toLowerCase().includes(query.toLowerCase())));

  return (
    <div className="max-w-5xl">
      <div className="flex items-center justify-between mb-2">
        <h1 className="font-display font-extrabold text-2xl text-ink uppercase tracking-tight">Mercados</h1>
        <Btn variant="primary" onClick={() => setShowForm((s) => !s)}>{showForm ? "Cancelar" : "+ Crear mercado"}</Btn>
      </div>
      <p className="font-body text-sm text-muted mb-4">Elegí en qué países vendés y con qué moneda se muestra cada uno.</p>

      <div className="relative mb-5 max-w-xs">
        <ISearch className="w-3.5 h-3.5 text-ink/35 absolute left-3 top-1/2 -translate-y-1/2" />
        <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Buscar en todos los mercados" className={`${inputCls} w-full pl-8`} />
      </div>

      {showForm && (
        <Panel className="p-4 mb-5 flex flex-wrap gap-3 items-end">
          <Field label="Nombre del mercado"><input value={name} onChange={(e) => setName(e.target.value)} className={`${inputCls} w-52`} placeholder="Ej. Centroamérica" /></Field>
          <Field label="Países (separados por coma)"><input value={countries} onChange={(e) => setCountries(e.target.value)} className={`${inputCls} w-64`} placeholder="Ej. Costa Rica, Panamá" /></Field>
          <Field label="Moneda">
            <select value={currency} onChange={(e) => setCurrency(e.target.value)} className={inputCls}>
              <option value="USD">Dólar (USD)</option><option value="EUR">Euro (EUR)</option><option value="ARS">Peso argentino (ARS)</option>
            </select>
          </Field>
          <Btn variant="primary" onClick={createCustom}>Crear</Btn>
        </Panel>
      )}

      <Panel className="overflow-hidden mb-6">
        <table className="w-full text-left">
          <thead>
            <tr className="border-b border-black/10 bg-[#FAFAF7]">
              {["Mercado", "Estado", "Incluye", "Moneda", ""].map((h) => (
                <th key={h} className="px-4 py-2.5 font-body text-xs font-semibold text-muted uppercase tracking-wide">{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {filteredMarkets.map((m) => (
              <tr key={m.id} className="border-b border-black/5 last:border-0 hover:bg-black/[0.015]">
                <td className="px-4 py-3">
                  <button onClick={() => setEditing(m)} className="font-body text-sm font-semibold text-ink hover:underline">{m.name}</button>
                </td>
                <td className="px-4 py-3">
                  <button onClick={() => toggleStatus(m.id)} className={`text-xs font-semibold px-2.5 py-1 rounded-full border ${m.status === "Activo" ? "bg-ok/10 text-ok border-ok/30" : "bg-black/5 text-muted border-black/10"}`}>
                    {m.status}
                  </button>
                </td>
                <td className="px-4 py-3 font-body text-sm text-ink/60">{m.flag} {m.countries.join(", ")}</td>
                <td className="px-4 py-3 font-body text-sm text-muted">{m.currency}</td>
                <td className="px-4 py-3 text-right">
                  <button onClick={() => setEditing(m)} className="text-muted hover:text-ink" aria-label={`Configurar ${m.name}`}><ISettings className="w-4 h-4" /></button>
                </td>
              </tr>
            ))}
            {filteredMarkets.length === 0 && (
              <tr><td colSpan="5" className="px-4 py-6 text-center font-body text-sm text-muted">Sin resultados para "{query}"</td></tr>
            )}
          </tbody>
        </table>
      </Panel>

      <div className="font-body text-sm font-semibold text-ink mb-2">Mercados sugeridos</div>
      <div className="grid grid-cols-2 gap-4">
        {SUGGESTED_MARKETS.map((s) => (

              <div className="font-body text-sm font-semibold text-ink">{s.flags} {s.name}</div>

            </div>
            <Btn variant="outline" onClick={() => createFromSuggested(s)}>Crear</Btn>
          </Panel>
        ))}
      </div>

      {editing && (
        <Modal title={`Configurar: ${editing.name}`} onClose={() => setEditing(null)} wide>
          <div className="flex flex-col gap-4">
            <Field label="Nombre del mercado"><input value={editing.name} onChange={(e) => setEditing({ ...editing, name: e.target.value })} className={inputCls} /></Field>
            <Field label="Países incluidos (separados por coma)">
              <input value={editing.countries.join(", ")} onChange={(e) => setEditing({ ...editing, countries: e.target.value.split(",").map((c) => c.trim()).filter(Boolean) })} className={inputCls} />

            <div className="flex gap-3">

                <select value={editing.currency} onChange={(e) => setEditing({ ...editing, currency: e.target.value })} className={inputCls}>
                  <option value="USD">Dólar (USD)</option><option value="EUR">Euro (EUR)</option><option value="ARS">Peso argentino (ARS)</option>
                  <option value="CLP">Peso chileno (CLP)</option><option value="MXN">Peso mexicano (MXN)</option>
                </select>
              </Field>
              <Field label="Redondeo de precios">
                <select value={editing.rounding} onChange={(e) => setEditing({ ...editing, rounding: e.target.value })} className={inputCls}>
                  <option>Sin redondeo</option><option>Redondear a entero</option><option>Terminar en ,99</option>
                </select>
              </Field>
            </div>
            <div className="flex gap-3">
              <Field label="Idioma"><select value={editing.language} onChange={(e) => setEditing({ ...editing, language: e.target.value })} className={inputCls}><option>Español</option><option>Inglés</option><option>Portugués</option></select></Field>

            </div>
            <div className="flex gap-2 mt-1">
              <Btn variant="outline" className="flex-1" onClick={() => setEditing(null)}>Cancelar</Btn>
              <Btn variant="primary" className="flex-1" onClick={saveMarket}>Guardar cambios</Btn>
            </div>
          </div>
        </Modal>
      )}
    </div>
  );

        <div className="min-w-0">
          {content[section]}
          {!noSaveButton && <Btn variant="primary" className="mt-4" onClick={save}>Guardar configuración</Btn>}
        </div>
      </div>
    </div>
  );
};

const PlaceholderView = ({ title }) => (
  <div className="max-w-5xl">
    <h1 className="font-display font-extrabold text-2xl text-ink uppercase tracking-tight mb-3">{title}</h1>
    <Panel className="p-10 text-center">
      <p className="font-body text-sm text-muted">Sección en construcción</p>
    </Panel>
  </div>
);

/* ---------------- APP ---------------- */
function App() {
  const [user, setUser] = useState(null);
  const [active, setActive] = useState("inicio");
  const [inventory, setInventory] = useState(INITIAL_INVENTORY);
  const [ordersList, setOrdersList] = useState(orders);
  const [published, setPublished] = useState(true);
  const [toast, setToast] = useState(null);
  const [sidebarOpen, setSidebarOpen] = useState(false);

  const flash = (msg) => {
    setToast(msg);
    setTimeout(() => setToast(null), 2000);
  };

  const navigate = (key) => setActive(key);
  const addProduct = (p) => setInventory((prev) => [p, ...prev]);
  const updateCondition = (id, condition) => {
    setInventory((prev) => prev.map((i) => (i.id === id ? { ...i, condition } : i)));
    flash(`Estado actualizado: ${condition}`);
  };
  const updateLocation = (id, location) => {
    setInventory((prev) => prev.map((i) => (i.id === id ? { ...i, location } : i)));
  };
  const updateProduct = (updated) => {
    setInventory((prev) => prev.map((i) => (i.id === updated.id ? updated : i)));
  };
  const togglePublish = () => {
    setPublished((p) => !p);
    flash(!published ? "Tienda publicada" : "Tienda oculta al público");
  };

  const login = (u) => {
    setUser(u);
    setActive("inicio");
  };
  const logout = () => {
    setUser(null);
    flash("Sesión cerrada");
  };

  if (!user) return <LoginView onLogin={login} />;

  const allowed = ROLE_ACCESS[user.role];

  const views = {
    inicio: <InicioView inventory={inventory} orders={ordersList} navigate={navigate} flash={flash} published={published} />,
    pedidos: <PedidosView orders={ordersList} setOrders={setOrdersList} flash={flash} />,
    borradores: <BorradoresView onConvert={(o) => setOrdersList((prev) => [o, ...prev])} flash={flash} />,
    inventario: <InventarioView inventory={inventory} addProduct={addProduct} updateCondition={updateCondition} updateProduct={updateProduct} flash={flash} />,
    colecciones: <ColeccionesView inventory={inventory} flash={flash} />,
    transferencias: <TransferenciasView inventory={inventory} updateLocation={updateLocation} flash={flash} />,
    clientes: <ClientesView orders={ordersList} flash={flash} />,
    bandeja: <BandejaView />,
    informes: <InformesView />,
    marketing: <MarketingView flash={flash} />,
    automatizaciones: <AutomatizacionesView flash={flash} />,
    calendario: <CalendarioView inventory={inventory} />,
    descuentos: <DescuentosView flash={flash} />,
    regalo: <TarjetasRegaloView flash={flash} />,
    resenas: <ReseñasView />,
    archivos: <ArchivosView flash={flash} />,
    mercados: <MarketsView flash={flash} />,
    finanzas: <FinanzasView />,
    catalogos: <CatalogosView flash={flash} />,
    apps: <AppsView flash={flash} />,
    tienda: <TiendaView flash={flash} />,
    configuracion: <ConfiguracionView flash={flash} role={user.role} />,
  };

  const activeKey = views[active] ? active : "inicio";
  const lowStockCount = inventory.filter((i) => i.low).length;
  const pendingOrdersCount = ordersList.filter((o) => o.status === "Pendiente").length;

  return (
    <div className="flex min-h-screen bg-[#F7F4EB]">
      <Sidebar active={activeKey} onChange={setActive} published={published} onTogglePublish={togglePublish} flash={flash} allowed={allowed} lowStockCount={lowStockCount} pendingOrdersCount={pendingOrdersCount} mobileOpen={sidebarOpen} closeMobile={() => setSidebarOpen(false)} />
      <div className="flex-1 min-w-0">
        <TopBar navigate={navigate} flash={flash} inventory={inventory} orders={ordersList} user={user} onLogout={logout} onOpenMenu={() => setSidebarOpen(true)} />
        <main className="p-4 md:p-8 overflow-x-auto">{views[activeKey]}</main>
      </div>
      {toast && <Toast message={toast} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
