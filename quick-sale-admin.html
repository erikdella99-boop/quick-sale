const downloadCSV = (filename, rows) => {
  const csv = rows.map((r) => r.map((v) => `"${String(v).replace(/"/g, '""')}"`).join(",")).join("\n");
  const blob = new Blob(["\uFEFF" + csv], { type: "text/csv;charset=utf-8;" });
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url; a.download = filename; a.click();
  URL.revokeObjectURL(url);
};

const TopBar = ({ navigate, flash, inventory, orders: orderList, user, onLogout, onOpenMenu }) => {
  const [query, setQuery] = useState("");
  const [accountOpen, setAccountOpen] = useState(false);
  const [notifOpen, setNotifOpen] = useState(false);
  const notifCloseTimer = useRef(null);
  const showNotif = () => { clearTimeout(notifCloseTimer.current); setNotifOpen(true); };
  const hideNotif = () => { notifCloseTimer.current = setTimeout(() => setNotifOpen(false), 150); };
  const searchRef = useRef(null);
  const initials = user.name.split(" ").map((w) => w[0]).slice(0, 2).join("").toUpperCase();

  useEffect(() => {
    const onKey = (e) => {
      if (e.key === "/" && document.activeElement.tagName !== "INPUT" && document.activeElement.tagName !== "TEXTAREA") {
        e.preventDefault();
        searchRef.current?.focus();
      }
    };
    window.addEventListener("keydown", onKey);
    return () => window.removeEventListener("keydown", onKey);
  }, []);

  const results = query.trim()
    ? [
        ...NAVIGABLE_SECTIONS.filter((s) => s.label.toLowerCase().includes(query.toLowerCase())).map((s) => ({ label: s.label, sub: "Sección", go: s.key })),
        ...inventory.filter((i) => i.name.toLowerCase().includes(query.toLowerCase())).map((i) => ({ label: i.name, sub: "Inventario", go: "inventario" })),
        ...STORE_PRODUCTS.filter((p) => p.name.toLowerCase().includes(query.toLowerCase())).map((p) => ({ label: p.name, sub: "Tienda", go: "tienda" })),
        ...CLIENTS.filter((c) => c.name.toLowerCase().includes(query.toLowerCase())).map((c) => ({ label: c.name, sub: "Clientes", go: "clientes" })),
      ].slice(0, 8)
    : [];

  const lowStock = inventory.filter((i) => i.low);
  const pendingDeposits = orderList.filter((o) => o.depositStatus === "Pendiente");
  const nextReservation = [...RESERVATIONS].sort((a, b) => (a.from > b.from ? 1 : -1))[0];
  const notifCount = lowStock.length + pendingDeposits.length;

  return (
    <header className="h-14 border-b border-black/10 bg-white flex items-center px-4 md:px-5 gap-3 md:gap-4 sticky top-0 z-10">
      <button onClick={onOpenMenu} className="md:hidden p-2 -ml-1 text-ink/70 hover:bg-black/[0.04] rounded-xl flex-shrink-0" aria-label="Abrir menú">

          ref={searchRef}
          value={query}

          className="w-full bg-[#F7F4EB] rounded-xl pl-9 pr-3 py-2 font-body text-sm outline-none placeholder:text-ink/35"
        />
        {results.length > 0 && (
          <>
            <div className="fixed inset-0 z-20" onClick={() => setQuery("")} />
            <div className="absolute z-30 mt-1.5 w-full bg-white border border-black/10 rounded-xl shadow-lg py-1.5">
              {results.map((r, idx) => (
                <button
                  key={idx}
                  onClick={() => { navigate(r.go); setQuery(""); }}
                  className="w-full flex items-center justify-between px-3.5 py-2 font-body text-sm text-ink/80 hover:bg-black/[0.04]"
                >
                  <span>{r.label}</span>
                  <span className="text-[10px] font-semibold text-ink/35 uppercase">{r.sub}</span>
                </button>
              ))}
            </div>
          </>
        )}
      </div>

      <div className="relative" onMouseEnter={showNotif} onMouseLeave={hideNotif}>
        <button
          onClick={() => setNotifOpen((o) => !o)}
          className="relative p-2 rounded-xl hover:bg-black/[0.04]"
          aria-label="Notificaciones"
        >
          <IBell className="w-[18px] h-[18px] text-ink/60" />
          {notifCount > 0 && (
            <span className="absolute top-1 right-1 w-2 h-2 rounded-full bg-low" />
          )}
        </button>
        {notifOpen && (
          <Panel className="absolute right-0 top-full mt-2 w-72 z-30 p-2 flex flex-col gap-1.5 shadow-lg">
            <div className="px-1.5 pt-1 font-display font-bold text-xs uppercase text-ink">Notificaciones</div>
            {lowStock.map((i) => (
              <button key={i.id} onClick={() => { navigate("inventario"); setNotifOpen(false); }} className="text-left">
                <Panel className="p-2.5 flex items-start gap-2 border-black/10">
                  <span className="w-2 h-2 rounded-full bg-low flex-shrink-0 mt-1" />
                  <div>
                    <span className="font-body text-xs text-ink/80 block">Stock bajo: {i.name} ({i.stock})</span>
                    <span className="font-body text-[10px] text-muted">{i.lowSince || "—"}</span>
                  </div>
                </Panel>
              </button>
            ))}
            {pendingDeposits.map((o) => (
              <button key={o.id} onClick={() => { navigate("pedidos"); setNotifOpen(false); }} className="text-left">
                <Panel className="p-2.5 flex items-start gap-2 border-black/10">
                  <span className="w-2 h-2 rounded-full bg-mustardDark flex-shrink-0 mt-1" />

                    <span className="font-body text-xs text-ink/80 block">Fianza pendiente: {o.id}</span>
                    <span className="font-body text-[10px] text-muted">{o.date}</span>
                  </div>
                </Panel>
              </button>
            ))}
            {nextReservation && (
              <button onClick={() => { navigate("calendario"); setNotifOpen(false); }} className="text-left">
                <Panel className="p-2.5 flex items-start gap-2 border-black/10">
                  <span className="w-2 h-2 rounded-full bg-ok flex-shrink-0 mt-1" />
                  <div>
                    <span className="font-body text-xs text-ink/80 block">Próximo evento: {nextReservation.client}</span>
                    <span className="font-body text-[10px] text-muted">{fmtDate(nextReservation.from)} SEP</span>
                  </div>
                </Panel>
              </button>
            )}
            {notifCount === 0 && !nextReservation && (
              <p className="font-body text-xs text-muted px-1.5 py-2">Sin novedades</p>
            )}
          </Panel>
        )}
      </div>

      <div className="ml-auto">
        <Dropdown
          align="right"
          open={accountOpen}
          setOpen={setAccountOpen}
          trigger={
            <div className="flex items-center gap-2 cursor-pointer">
              <div className="w-8 h-8 rounded-full bg-mustard border border-ink/10 flex items-center justify-center">

        >
          <DropdownItem onClick={() => { navigate("configuracion"); setAccountOpen(false); }}>
            <span className="flex items-center gap-2"><IUser className="w-3.5 h-3.5" /> Mi perfil</span>
          </DropdownItem>
          <DropdownItem onClick={() => { navigate("configuracion"); setAccountOpen(false); }}>
            <span className="flex items-center gap-2"><ISettings className="w-3.5 h-3.5" /> Preferencias</span>

          <DropdownItem onClick={() => { onLogout(); setAccountOpen(false); }}>
            <span className="flex items-center gap-2 text-low"><ILogout className="w-3.5 h-3.5" /> Cerrar sesión</span>
          </DropdownItem>
        </Dropdown>
      </div>
    </header>
  );
};

  useEffect(() => {

  return (
    <div className="fixed inset-0 z-40 flex items-center justify-center p-4" role="dialog" aria-modal="true" aria-label={title}>
      <div className="absolute inset-0 bg-ink/40" onClick={onClose} />

      {preview && (
        <Modal title="Vista previa de la tienda" onClose={() => setPreview(false)} wide>
          <div className="grid grid-cols-2 gap-3">

              <div key={p.id} className="rounded-xl border border-black/10 overflow-hidden">

};

const ORDER_STATUSES = ["Pendiente", "Seña pagada", "Pago total", "Entregado", "Cancelado"];
const DEPOSIT_STATUSES = ["Pendiente", "Retenida", "Devuelta parcial", "Devuelta total"];
const FULFILLMENT_STATUSES = ["Pendiente de entrega", "Entregado", "Devuelto"];
const ORDER_FILTERS = [
  { key: "todos", label: "Todos" },
  { key: "pendientes", label: "Pendientes de cobro" },
  { key: "entregar", label: "Por entregar" },
  { key: "devolver", label: "Por devolver" },
  { key: "cancelados", label: "Cancelados" },
];

const OrderStatusBadge = ({ status }) => (
  <span className={`text-xs font-semibold px-2 py-1 rounded-full border whitespace-nowrap ${
    status === "Pendiente" ? "bg-low/10 text-low border-low/25" :
    status === "Cancelado" ? "bg-black/5 text-muted border-black/10" : "bg-ok/10 text-ok border-ok/25"
  }`}>{status}</span>
);
const FulfillmentBadge = ({ status }) => (
  <span className={`text-xs font-semibold px-2 py-1 rounded-full border whitespace-nowrap ${
    status === "Devuelto" ? "bg-ok/10 text-ok border-ok/30" :
    status === "Entregado" ? "bg-mustard/15 text-ink/70 border-mustard/40" : "bg-ink/5 text-muted border-ink/15"
  }`}>{status || "Pendiente de entrega"}</span>
);

const NewOrderModal = ({ onClose, onCreate }) => {
  const [client, setClient] = useState("");
  const [date, setDate] = useState("");
  const [lines, setLines] = useState([{ id: 1, name: "", qty: 1, price: 0 }]);
  const [deposit, setDeposit] = useState(0);
  const [paymentMethod, setPaymentMethod] = useState("Efectivo");

  const addLine = () => setLines((p) => [...p, { id: Date.now(), name: "", qty: 1, price: 0 }]);
  const updateLine = (id, patch) => setLines((p) => p.map((l) => (l.id === id ? { ...l, ...patch } : l)));
  const removeLine = (id) => setLines((p) => p.filter((l) => l.id !== id));
  const total = lines.reduce((a, l) => a + (Number(l.qty) || 0) * (Number(l.price) || 0), 0);

  const create = () => {
    if (!client.trim() || lines.every((l) => !l.name.trim())) return;
    onCreate({
      id: `#${Math.floor(1000 + Math.random() * 9000)}`,
      client, date: date || "Sin fecha", total, deposit: Number(deposit) || 0, depositStatus: deposit > 0 ? "Pendiente" : "Retenida",
      status: "Pendiente", fulfillment: "Pendiente de entrega", paymentMethod, email: "", phone: "",
      items: lines.filter((l) => l.name.trim()).map((l) => ({ name: l.name, qty: Number(l.qty) || 1, price: Number(l.price) || 0 })),
      tags: [], notes: [],
    });
  };

  return (
    <Modal title="Crear pedido" onClose={onClose} wide>
      <div className="flex flex-col gap-4">
        <div className="flex gap-3">
          <Field label="Cliente / evento"><input value={client} onChange={(e) => setClient(e.target.value)} className={`${inputCls} flex-1`} placeholder="Ej. Cumpleaños Sosa" /></Field>
          <Field label="Fecha del evento"><input value={date} onChange={(e) => setDate(e.target.value)} className={`${inputCls} w-40`} placeholder="Ej. 28 sept 2026" /></Field>
        </div>

        <div>
          <div className="font-body text-[11px] font-semibold uppercase tracking-wide text-muted mb-2">Artículos</div>
          <div className="flex flex-col gap-2">
            {lines.map((l) => (
              <div key={l.id} className="flex gap-2 items-end">
                <Field label="Producto"><input value={l.name} onChange={(e) => updateLine(l.id, { name: e.target.value })} className={`${inputCls} w-52`} /></Field>
                <Field label="Cant."><input type="number" value={l.qty} onChange={(e) => updateLine(l.id, { qty: e.target.value })} className={`${inputCls} w-16`} /></Field>
                <Field label="Precio"><input type="number" value={l.price} onChange={(e) => updateLine(l.id, { price: e.target.value })} className={`${inputCls} w-24`} /></Field>
                <button onClick={() => removeLine(l.id)} className="p-2 text-ink/30 hover:text-low flex-shrink-0"><ITrash className="w-4 h-4" /></button>
              </div>
            ))}
          </div>
          <button onClick={addLine} className="font-body text-xs font-semibold text-ink/60 hover:text-ink mt-2">+ Añadir artículo</button>
        </div>

        <div className="flex gap-3">
          <Field label="Fianza / depósito"><input type="number" value={deposit} onChange={(e) => setDeposit(e.target.value)} className={inputCls} /></Field>
          <Field label="Método de pago">
            <select value={paymentMethod} onChange={(e) => setPaymentMethod(e.target.value)} className={inputCls}>
              <option>Efectivo</option><option>Transferencia</option><option>Mercado Pago</option><option>Tarjeta</option>
            </select>
          </Field>
        </div>

        <Panel className="p-3 bg-cream border-black/5">
          <div className="flex justify-between font-body text-sm"><span className="text-ink/60">Total del pedido</span><span className="font-display font-bold text-ink">{fmt(total)}</span></div>
        </Panel>

        <div className="flex gap-2">
          <Btn variant="outline" className="flex-1" onClick={onClose}>Cancelar</Btn>
          <Btn variant="primary" className="flex-1" onClick={create}>Crear pedido</Btn>
        </div>
      </div>
    </Modal>
  );
};

const PedidosView = ({ orders: list, setOrders: setList, flash }) => {
  const [selected, setSelected] = useState(null);
  const [query, setQuery] = useState("");
  const [filter, setFilter] = useState("todos");
  const [checked, setChecked] = useState([]);
  const [showNew, setShowNew] = useState(false);
  const [noteInput, setNoteInput] = useState("");

  const updateStatus = (id, status) => {
    setList((prev) => prev.map((o) => (o.id === id ? { ...o, status } : o)));
    setSelected((s) => (s ? { ...s, status } : s));
    flash(`Pedido ${id} → ${status}`);
  };

  const updateDeposit = (id, depositStatus) => {
    setList((prev) => prev.map((o) => (o.id === id ? { ...o, depositStatus } : o)));
    setSelected((s) => (s ? { ...s, depositStatus } : s));
    flash(`Fianza de ${id}: ${depositStatus}`);
  };

  const updateFulfillment = (id, fulfillment) => {
    setList((prev) => prev.map((o) => (o.id === id ? { ...o, fulfillment } : o)));
    setSelected((s) => (s ? { ...s, fulfillment } : s));
  };

  const addNote = () => {
    if (!noteInput.trim()) return;
    const note = { id: Date.now(), text: noteInput.trim(), time: new Date().toLocaleDateString("es-AR") + " · " + new Date().toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" }) };
    setList((prev) => prev.map((o) => (o.id === selected.id ? { ...o, notes: [note, ...(o.notes || [])] } : o)));
    setSelected((s) => ({ ...s, notes: [note, ...(s.notes || [])] }));
    setNoteInput("");
  };

  const createOrder = (order) => {
    setList((prev) => [order, ...prev]);
    setShowNew(false);
    flash(`Pedido ${order.id} creado`);
  };

  const deleteOrder = (id) => {
    setList((prev) => prev.filter((o) => o.id !== id));
    setSelected(null);
    flash(`Pedido ${id} eliminado`);
  };

  const toggleCheck = (id) => setChecked((p) => (p.includes(id) ? p.filter((x) => x !== id) : [...p, id]));
  const toggleCheckAll = () => setChecked((p) => (p.length === filtered.length ? [] : filtered.map((o) => o.id)));

  const bulkMark = (status) => {
    setList((prev) => prev.map((o) => (checked.includes(o.id) ? { ...o, status } : o)));
    flash(`${checked.length} pedido${checked.length > 1 ? "s" : ""} marcado${checked.length > 1 ? "s" : ""} como "${status}"`);
    setChecked([]);
  };

  const exportCSV = (rows = list) => {
    downloadCSV("pedidos.csv", [
      ["Pedido", "Cliente", "Fecha", "Total", "Fianza", "Estado fianza", "Estado", "Entrega"],
      ...rows.map((o) => [o.id, o.client, o.date, o.total, o.deposit, o.depositStatus, o.status, o.fulfillment || "Pendiente de entrega"]),
    ]);
    flash(`${rows.length} pedido${rows.length > 1 ? "s" : ""} exportado${rows.length > 1 ? "s" : ""} a CSV`);
  };

  const filtered = list.filter((o) => {
    const q = query.toLowerCase();
    const matchesQuery = o.id.toLowerCase().includes(q) || o.client.toLowerCase().includes(q);
    const matchesFilter =
      filter === "todos" ? true :
      filter === "pendientes" ? (o.status === "Pendiente" || o.depositStatus === "Pendiente") :
      filter === "entregar" ? (o.fulfillment || "Pendiente de entrega") === "Pendiente de entrega" :
      filter === "devolver" ? o.fulfillment === "Entregado" :
      filter === "cancelados" ? o.status === "Cancelado" : true;
    return matchesQuery && matchesFilter;
  });

  const stats = {
    total: list.length,
    facturado: list.reduce((a, o) => a + o.total, 0),
    pendienteCobro: list.filter((o) => o.status === "Pendiente" || o.depositStatus === "Pendiente").length,
    pendienteEntrega: list.filter((o) => (o.fulfillment || "Pendiente de entrega") === "Pendiente de entrega").length,
  };

  return (
    <div className="max-w-5xl">
      <div className="flex items-center justify-between mb-5">
        <h1 className="font-display font-extrabold text-2xl text-ink uppercase tracking-tight">Pedidos</h1>
        <div className="flex gap-2">
          <Btn variant="outline" onClick={() => exportCSV()}>Exportar CSV</Btn>
          <Btn variant="primary" onClick={() => setShowNew(true)}>+ Crear pedido</Btn>
        </div>
      </div>

      <div className="grid grid-cols-4 gap-3 mb-5">
        <Panel className="p-3.5"><div className="font-display font-extrabold text-xl text-ink">{stats.total}</div><div className="font-body text-[11px] text-muted mt-0.5">Pedidos</div></Panel>
        <Panel className="p-3.5"><div className="font-display font-extrabold text-xl text-ink">{fmt(stats.facturado)}</div><div className="font-body text-[11px] text-muted mt-0.5">Facturado</div></Panel>
        <Panel className="p-3.5"><div className="font-display font-extrabold text-xl text-low">{stats.pendienteCobro}</div><div className="font-body text-[11px] text-muted mt-0.5">Pendientes de cobro</div></Panel>
        <Panel className="p-3.5"><div className="font-display font-extrabold text-xl text-ink">{stats.pendienteEntrega}</div><div className="font-body text-[11px] text-muted mt-0.5">Por entregar</div></Panel>
      </div>

      <div className="flex items-center justify-between gap-3 mb-4 flex-wrap">
        <div className="flex gap-2 overflow-x-auto no-scrollbar">
          {ORDER_FILTERS.map((f) => (
            <Chip key={f.key} active={filter === f.key} onClick={() => setFilter(f.key)}>{f.label}</Chip>
          ))}
        </div>
        <div className="relative max-w-xs">
          <ISearch className="w-3.5 h-3.5 text-ink/35 absolute left-3 top-1/2 -translate-y-1/2" />
          <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Buscar por N° o cliente..." className={`${inputCls} w-full pl-8`} />
        </div>
      </div>

      {checked.length > 0 && (
        <Panel className="p-3 mb-3 flex items-center justify-between bg-ink border-ink">
          <span className="font-body text-xs text-cream/70">{checked.length} seleccionado{checked.length > 1 ? "s" : ""}</span>
          <div className="flex gap-2">
            <button onClick={() => bulkMark("Pago total")} className="font-body text-xs font-semibold text-mustard hover:underline">Marcar pagados</button>
            <button onClick={() => exportCSV(list.filter((o) => checked.includes(o.id)))} className="font-body text-xs font-semibold text-cream/70 hover:underline">Exportar</button>
            <button onClick={() => setChecked([])} className="font-body text-xs font-semibold text-cream/40 hover:underline">Cancelar</button>
          </div>
        </Panel>
      )}

      <Panel className="overflow-hidden">
        <table className="w-full text-left">
          <thead>
            <tr className="border-b border-black/10 bg-[#FAFAF7]">
              <th className="px-4 py-2.5 w-8"><input type="checkbox" checked={checked.length === filtered.length && filtered.length > 0} onChange={toggleCheckAll} className="w-4 h-4 accent-ink" /></th>
              {["Pedido", "Cliente / evento", "Fecha", "Total", "Fianza", "Estado", "Entrega"].map((h) => (
                <th key={h} className="px-4 py-2.5 font-body text-xs font-semibold text-muted uppercase tracking-wide">{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {filtered.map((o) => (
              <tr key={o.id} className="border-b border-black/5 last:border-0 hover:bg-black/[0.02]">
                <td className="px-4 py-3" onClick={(e) => e.stopPropagation()}>
                  <input type="checkbox" checked={checked.includes(o.id)} onChange={() => toggleCheck(o.id)} className="w-4 h-4 accent-ink" />
                </td>
                <td className="px-4 py-3 font-body text-sm font-semibold text-ink cursor-pointer" onClick={() => setSelected(o)}>{o.id}</td>
                <td className="px-4 py-3 font-body text-sm text-ink/70 cursor-pointer" onClick={() => setSelected(o)}>{o.client}</td>
                <td className="px-4 py-3 font-body text-sm text-muted cursor-pointer" onClick={() => setSelected(o)}>{o.date}</td>
                <td className="px-4 py-3 font-body text-sm font-semibold text-ink cursor-pointer" onClick={() => setSelected(o)}>{fmt(o.total)}</td>
                <td className="px-4 py-3 font-body text-xs text-muted cursor-pointer" onClick={() => setSelected(o)}>{fmt(o.deposit)} · {o.depositStatus}</td>
                <td className="px-4 py-3 cursor-pointer" onClick={() => setSelected(o)}><OrderStatusBadge status={o.status} /></td>
                <td className="px-4 py-3 cursor-pointer" onClick={() => setSelected(o)}><FulfillmentBadge status={o.fulfillment} /></td>
              </tr>
            ))}
            {filtered.length === 0 && (
              <tr><td colSpan="8" className="px-4 py-8 text-center font-body text-sm text-muted">Sin pedidos en este filtro</td></tr>
            )}
          </tbody>
        </table>
      </Panel>

      {showNew && <NewOrderModal onClose={() => setShowNew(false)} onCreate={createOrder} />}

      {selected && (
        <Modal title={`Pedido ${selected.id}`} onClose={() => setSelected(null)} wide>
          <div className="flex flex-col gap-4">
            <div className="flex items-start justify-between">
              <div>
                <div className="font-body text-sm font-semibold text-ink">{selected.client}</div>
                <div className="font-body text-xs text-muted mt-0.5">{selected.date}</div>
                {(selected.email || selected.phone) && (
                  <div className="font-body text-[11px] text-muted mt-0.5">{selected.email} {selected.phone && `· ${selected.phone}`}</div>
                )}
              </div>
              <button onClick={() => deleteOrder(selected.id)} className="text-ink/30 hover:text-low flex-shrink-0" aria-label="Eliminar pedido"><ITrash className="w-4 h-4" /></button>
            </div>

            {selected.tags && selected.tags.length > 0 && (
              <div className="flex flex-wrap gap-1.5">
                {selected.tags.map((t) => (
                  <span key={t} className="text-[10px] font-semibold px-2 py-0.5 rounded-full border bg-mustard/15 text-ink/70 border-mustard/40">{t}</span>
                ))}
              </div>
            )}

            <div>
              <div className="font-body text-[11px] font-semibold uppercase tracking-wide text-muted mb-1.5">Artículos</div>
              <Panel className="p-3 flex flex-col divide-y divide-dashed divide-black/10">
                {(selected.items || []).map((it, idx) => (
                  <div key={idx} className="flex justify-between py-1.5 font-body text-sm first:pt-0 last:pb-0">
                    <span className="text-ink/70">{it.qty}x {it.name}</span>
                    <span className="font-semibold text-ink">{fmt(it.qty * it.price)}</span>
                  </div>
                ))}
                {(!selected.items || selected.items.length === 0) && <p className="font-body text-xs text-muted">Sin artículos detallados</p>}
              </Panel>
            </div>

            <div className="flex gap-3">
              <Field label="Estado del pedido">
                <select value={selected.status} onChange={(e) => updateStatus(selected.id, e.target.value)} className={inputCls}>
                  {ORDER_STATUSES.map((s) => <option key={s}>{s}</option>)}
                </select>
              </Field>
              <Field label="Método de pago"><div className={`${inputCls} flex items-center`}>{selected.paymentMethod || "—"}</div></Field>
            </div>

            <div className="border-t border-dashed border-black/10 pt-3">
              <div className="flex justify-between mb-1.5">
                <span className="font-body text-xs text-muted">Fianza / depósito de garantía</span>
                <span className="font-display font-bold text-sm text-ink">{fmt(selected.deposit)}</span>
              </div>
              <Field label="Estado de la fianza">
                <select value={selected.depositStatus} onChange={(e) => updateDeposit(selected.id, e.target.value)} className={inputCls}>
                  {DEPOSIT_STATUSES.map((s) => <option key={s}>{s}</option>)}
                </select>
              </Field>
              <p className="font-body text-[11px] text-muted mt-1.5">Separada del pago del alquiler — se devuelve si el material vuelve sin daños.</p>
            </div>

            <div className="border-t border-dashed border-black/10 pt-3">
              <div className="font-body text-[11px] font-semibold uppercase tracking-wide text-muted mb-2">Estado de entrega</div>
              <div className="grid grid-cols-3 gap-1.5">
                {FULFILLMENT_STATUSES.map((f) => (
                  <button
                    key={f}
                    onClick={() => updateFulfillment(selected.id, f)}
                    className={`text-[11px] font-semibold px-2 py-2 rounded-xl border text-center leading-tight ${
                      (selected.fulfillment || "Pendiente de entrega") === f ? "bg-ink text-mustard border-ink" : "bg-white text-ink/60 border-ink/15"
                    }`}
                  >
                    {f}
                  </button>
                ))}
              </div>
            </div>

            <div className="border-t border-dashed border-black/10 pt-3">
              <div className="font-body text-[11px] font-semibold uppercase tracking-wide text-muted mb-2">Notas internas</div>
              <div className="flex gap-2 mb-3">
                <input value={noteInput} onChange={(e) => setNoteInput(e.target.value)} onKeyDown={(e) => e.key === "Enter" && addNote()} placeholder="Agregar una nota..." className={`${inputCls} flex-1`} />
                <Btn variant="outline" onClick={addNote}>Añadir</Btn>
              </div>
              <div className="flex flex-col gap-2 max-h-40 overflow-y-auto">
                {(selected.notes || []).map((n) => (
                  <div key={n.id} className="font-body text-xs text-ink/60 border-l-2 border-mustard/50 pl-2.5">
                    <span className="text-muted">{n.time}</span> — {n.text}
                  </div>
                ))}
                {(!selected.notes || selected.notes.length === 0) && <p className="font-body text-xs text-ink/35">Sin notas todavía</p>}
              </div>
            </div>
          </div>
        </Modal>
      )}
    </div>
  );
};

const PRODUCT_TABS = ["General", "Precios", "Inventario", "Variantes", "Envío", "SEO"];

const ToggleRow = ({ label, checked, onChange, hint }) => (
  <label className="flex items-center justify-between py-2.5 border-b border-black/5 last:border-0 cursor-pointer">
    <div>
      <div className="font-body text-sm text-ink">{label}</div>
      {hint && <div className="font-body text-[11px] text-muted mt-0.5">{hint}</div>}
    </div>
    <input type="checkbox" checked={checked} onChange={onChange} className="w-4 h-4 accent-ink flex-shrink-0 ml-3" />
  </label>
);

const ProductDetailModal = ({ product, onClose, onSave, flash }) => {
  const [tab, setTab] = useState("General");
  const [p, setP] = useState(product);
  const [tagInput, setTagInput] = useState("");
  const set = (patch) => setP((prev) => ({ ...prev, ...patch }));

  const addTag = () => {
    if (!tagInput.trim()) return;
    set({ tags: [...(p.tags || []), tagInput.trim()] });
    setTagInput("");
  };
  const removeTag = (t) => set({ tags: p.tags.filter((x) => x !== t) });

  const addVariant = () => set({ variants: [...(p.variants || []), { id: Date.now(), name: "", stock: 0, sku: "" }] });
  const updateVariant = (id, patch) => set({ variants: p.variants.map((v) => (v.id === id ? { ...v, ...patch } : v)) });
  const removeVariant = (id) => set({ variants: p.variants.filter((v) => v.id !== id) });

  const save = () => {
    onSave(p);
    flash("Producto actualizado");
    onClose();
  };

  return (
    <div className="fixed inset-0 z-40 flex items-center justify-center p-4">
      <div className="absolute inset-0 bg-ink/40" onClick={onClose} />
      <div className="relative bg-white rounded-2xl border border-black/10 shadow-xl w-full max-w-2xl max-h-[90vh] flex flex-col">
        <div className="flex items-center justify-between px-5 py-4 border-b border-black/10">
          <div className="flex items-center gap-3 min-w-0">
            <div className="w-10 h-10 rounded-xl overflow-hidden border border-black/10 flex-shrink-0">
              <ProductIllustration type={p.illustration} />
            </div>
            <span className="font-display font-bold text-base text-ink truncate">{p.name || "Nuevo producto"}</span>
          </div>
          <button onClick={onClose} className="p-1 text-muted hover:text-ink flex-shrink-0" aria-label="Cerrar"><IX className="w-4 h-4" /></button>
        </div>

        <div className="flex gap-1 px-5 pt-3 border-b border-black/10 overflow-x-auto no-scrollbar">
          {PRODUCT_TABS.map((t) => (
            <button key={t} onClick={() => setTab(t)} className={`px-3 py-2 font-body text-sm font-semibold border-b-2 -mb-px whitespace-nowrap ${tab === t ? "border-ink text-ink" : "border-transparent text-muted hover:text-ink/70"}`}>
              {t}
            </button>
          ))}
        </div>

        <div className="p-5 overflow-y-auto flex-1">
          {tab === "General" && (
            <div className="flex flex-col gap-4">
              <div>
                <div className="font-body text-[11px] font-semibold uppercase tracking-wide text-muted mb-2">Imágenes</div>
                <div className="flex gap-2">
                  {["tent", "table", "chairs", "lights", "stage", "speaker"].map((t) => (
                    <button key={t} onClick={() => set({ illustration: t })} className={`w-14 h-14 rounded-xl overflow-hidden border-2 flex-shrink-0 ${p.illustration === t ? "border-ink" : "border-black/10 opacity-50"}`}>
                      <ProductIllustration type={t} />
                    </button>
                  ))}
                </div>
              </div>
              <Field label="Título"><input value={p.name} onChange={(e) => set({ name: e.target.value })} className={inputCls} /></Field>
              <Field label="Descripción"><textarea rows={3} value={p.description || ""} onChange={(e) => set({ description: e.target.value })} className={`${inputCls} resize-none`} /></Field>
              <div className="flex gap-3">
                <Field label="Estado">
                  <select value={p.status || "Activo"} onChange={(e) => set({ status: e.target.value })} className={inputCls}>
                    {PRODUCT_STATUSES.map((s) => <option key={s}>{s}</option>)}
                  </select>
                </Field>
                <Field label="Categoría">
                  <select value={p.category || ""} onChange={(e) => set({ category: e.target.value })} className={inputCls}>
                    <option value="">Sin categoría</option>
                    {CATEGORIES.map((c) => <option key={c}>{c}</option>)}
                  </select>
                </Field>
              </div>
              <Field label="Proveedor"><input value={p.vendor || ""} onChange={(e) => set({ vendor: e.target.value })} className={inputCls} /></Field>
              <div>
                <div className="font-body text-[11px] font-semibold uppercase tracking-wide text-muted mb-1.5">Etiquetas</div>
                <div className="flex flex-wrap gap-1.5 mb-2">
                  {(p.tags || []).map((t) => (
                    <span key={t} className="flex items-center gap-1 bg-mustard/15 border border-mustard/40 text-[11px] font-semibold text-ink/70 px-2 py-1 rounded-full">
                      {t}
                      <button onClick={() => removeTag(t)} className="text-muted hover:text-low"><IX className="w-2.5 h-2.5" /></button>
                    </span>
                  ))}
                </div>
                <div className="flex gap-2">
                  <input value={tagInput} onChange={(e) => setTagInput(e.target.value)} onKeyDown={(e) => e.key === "Enter" && addTag()} placeholder="Nueva etiqueta" className={`${inputCls} flex-1`} />
                  <Btn variant="outline" onClick={addTag}>Añadir</Btn>
                </div>
              </div>
              <div className="border-t border-dashed border-black/10 pt-3">
                <Field label="Notas internas (privado)"><textarea rows={2} value={p.notes || ""} onChange={(e) => set({ notes: e.target.value })} className={`${inputCls} resize-none`} placeholder="Solo vos y tu equipo lo ven" /></Field>
              </div>
            </div>
          )}

          {tab === "Precios" && (
            <div className="flex flex-col gap-4">
              <div className="flex gap-3">
                <Field label="Precio de venta"><input type="number" value={p.price || ""} onChange={(e) => set({ price: Number(e.target.value) })} className={inputCls} /></Field>
                <Field label="Precio comparativo"><input type="number" value={p.compareAtPrice || ""} onChange={(e) => set({ compareAtPrice: Number(e.target.value) || null })} className={inputCls} placeholder="Opcional" /></Field>
              </div>
              <div className="flex gap-3">
                <Field label="Precio de alquiler / día"><input type="number" value={p.rentalPricePerDay || ""} onChange={(e) => set({ rentalPricePerDay: Number(e.target.value) })} className={inputCls} /></Field>
                <Field label="Costo (para margen)"><input type="number" value={p.cost || ""} onChange={(e) => set({ cost: Number(e.target.value) })} className={inputCls} /></Field>
              </div>
              {p.price > 0 && p.cost > 0 && (
                <Panel className="p-3 bg-cream border-black/5">
                  <div className="flex justify-between font-body text-xs text-ink/60"><span>Margen estimado</span><span className="font-display font-bold text-ink">{fmt(p.price - p.cost)} ({Math.round(((p.price - p.cost) / p.price) * 100)}%)</span></div>
                </Panel>
              )}
            </div>
          )}

          {tab === "Inventario" && (
            <div className="flex flex-col gap-4">
              <div className="flex gap-3">
                <Field label="SKU"><input value={p.sku || ""} onChange={(e) => set({ sku: e.target.value })} className={inputCls} /></Field>
                <Field label="Código de barras"><input value={p.barcode || ""} onChange={(e) => set({ barcode: e.target.value })} className={inputCls} /></Field>
              </div>
              <div className="flex gap-3">
                <Field label="Stock"><input type="number" value={p.stock} onChange={(e) => set({ stock: Number(e.target.value), low: Number(e.target.value) <= (p.lowStockThreshold || 3) })} className={inputCls} /></Field>
                <Field label="Umbral de stock bajo"><input type="number" value={p.lowStockThreshold ?? 3} onChange={(e) => set({ lowStockThreshold: Number(e.target.value) })} className={inputCls} /></Field>
              </div>
              <Field label="Ubicación"><input value={p.location || ""} onChange={(e) => set({ location: e.target.value })} className={inputCls} /></Field>
              <Field label="Estado del material">
                <select value={p.condition || "Disponible"} onChange={(e) => set({ condition: e.target.value })} className={inputCls}>
                  {CONDITIONS.map((c) => <option key={c}>{c}</option>)}
                </select>
              </Field>
              <div className="border border-black/10 rounded-xl px-3">
                <ToggleRow label="Rastrear inventario" hint="Descuenta stock automáticamente en cada venta" checked={!!p.trackInventory} onChange={() => set({ trackInventory: !p.trackInventory })} />
                <ToggleRow label="Permitir venta sin stock" hint="Sigue vendiéndose aunque llegue a 0" checked={!!p.allowBackorder} onChange={() => set({ allowBackorder: !p.allowBackorder })} />
              </div>
            </div>
          )}

          {tab === "Variantes" && (
            <div className="flex flex-col gap-3">
              {(p.variants || []).length === 0 && <p className="font-body text-sm text-muted">Este producto no tiene variantes (color, tamaño, etc.)</p>}
              {(p.variants || []).map((v) => (
                <Panel key={v.id} className="p-3 flex flex-wrap gap-2 items-end">
                  <Field label="Nombre"><input value={v.name} onChange={(e) => updateVariant(v.id, { name: e.target.value })} className={`${inputCls} w-32`} /></Field>
                  <Field label="Stock"><input type="number" value={v.stock} onChange={(e) => updateVariant(v.id, { stock: Number(e.target.value) })} className={`${inputCls} w-20`} /></Field>
                  <Field label="SKU"><input value={v.sku} onChange={(e) => updateVariant(v.id, { sku: e.target.value })} className={`${inputCls} w-36`} /></Field>
                  <button onClick={() => removeVariant(v.id)} className="p-2 text-ink/30 hover:text-low"><ITrash className="w-4 h-4" /></button>
                </Panel>
              ))}
              <Btn variant="outline" onClick={addVariant}>+ Añadir variante</Btn>
            </div>
          )}

          {tab === "Envío" && (
            <div className="flex flex-col gap-4">
              <div className="flex gap-3">
                <Field label="Peso"><input value={p.weight || ""} onChange={(e) => set({ weight: e.target.value })} className={inputCls} placeholder="Ej. 18 kg" /></Field>
                <Field label="Dimensiones"><input value={p.dimensions || ""} onChange={(e) => set({ dimensions: e.target.value })} className={inputCls} placeholder="Ej. 300 x 300 x 250 cm" /></Field>
              </div>
              <div className="border border-black/10 rounded-xl px-3">
                <ToggleRow label="Requiere montaje" hint="El equipo de logística debe armarlo en el lugar" checked={!!p.requiresAssembly} onChange={() => set({ requiresAssembly: !p.requiresAssembly })} />
              </div>
              {p.requiresAssembly && (
                <Field label="Personas necesarias para el montaje"><input type="number" value={p.assemblyPeople || 1} onChange={(e) => set({ assemblyPeople: Number(e.target.value) })} className={`${inputCls} w-32`} /></Field>
              )}
            </div>
          )}

          {tab === "SEO" && (
            <div className="flex flex-col gap-4">
              <Field label="Título SEO"><input value={p.seoTitle || ""} onChange={(e) => set({ seoTitle: e.target.value })} className={inputCls} /></Field>
              <Field label="Descripción SEO"><textarea rows={2} value={p.seoDescription || ""} onChange={(e) => set({ seoDescription: e.target.value })} className={`${inputCls} resize-none`} /></Field>
              <Field label="URL amigable">
                <div className="flex items-center gap-1 font-body text-xs text-muted">
                  <span className="whitespace-nowrap">quicksale.com/productos/</span>
                  <input value={p.slug || ""} onChange={(e) => set({ slug: e.target.value })} className={`${inputCls} flex-1 text-ink`} />
                </div>
              </Field>
            </div>
          )}
        </div>

        <div className="px-5 py-4 border-t border-black/10 flex gap-2">
          <Btn variant="outline" className="flex-1" onClick={onClose}>Cancelar</Btn>
          <Btn variant="primary" className="flex-1" onClick={save}>Guardar cambios</Btn>
        </div>
      </div>
    </div>
  );
};

const InventarioView = ({ inventory, addProduct, updateCondition, updateProduct, flash }) => {
  const [showForm, setShowForm] = useState(false);
  const [name, setName] = useState("");
  const [stock, setStock] = useState("");
  const [location, setLocation] = useState("");
  const [filter, setFilter] = useState("todos");
  const [editing, setEditing] = useState(null);

  const submit = () => {
    if (!name.trim() || !stock) return;
    addProduct({ id: Date.now(), name, stock: Number(stock), location: location || "Sin ubicar", low: Number(stock) <= 3, condition: "Disponible", status: "Activo", illustration: "tent", tags: [], variants: [] });
    setName(""); setStock(""); setLocation(""); setShowForm(false);
    flash("Producto añadido al inventario");
  };

  const filtered = inventory.filter((i) => (filter === "todos" ? true : filter === "dañado" ? i.condition !== "Disponible" : i.status === "Borrador"));

  const exportCSV = () => {
    downloadCSV("productos.csv", [
      ["Producto", "SKU", "Ubicación", "Stock", "Precio", "Estado", "Estado del material"],
      ...inventory.map((i) => [i.name, i.sku || "", i.location, i.stock, i.price || "", i.status || "Activo", i.condition || "Disponible"]),
    ]);
    flash("Productos exportados a CSV");
  };

  return (
    <div className="max-w-5xl">
      <div className="flex items-center justify-between mb-5">
        <h1 className="font-display font-extrabold text-2xl text-ink uppercase tracking-tight">Productos</h1>
        <div className="flex gap-2">
          <Btn variant="outline" onClick={exportCSV}>Exportar CSV</Btn>
          <Btn variant="primary" onClick={() => setShowForm((s) => !s)}>{showForm ? "Cancelar" : "+ Añadir producto"}</Btn>
        </div>
      </div>

      {showForm && (
        <Panel className="p-4 mb-5 flex flex-wrap gap-3 items-end">
          <Field label="Nombre"><input value={name} onChange={(e) => setName(e.target.value)} className={`${inputCls} w-52`} placeholder="Ej. Tarima modular" /></Field>
          <Field label="Stock inicial"><input value={stock} onChange={(e) => setStock(e.target.value)} type="number" className={`${inputCls} w-28`} /></Field>
          <Field label="Ubicación"><input value={location} onChange={(e) => setLocation(e.target.value)} className={`${inputCls} w-52`} placeholder="Ej. Local A · Est. 4" /></Field>
          <Btn variant="primary" onClick={submit}>Guardar producto</Btn>
        </Panel>
      )}

      <div className="flex gap-2 mb-4">
        <Chip active={filter === "todos"} onClick={() => setFilter("todos")}>Todos</Chip>
        <Chip active={filter === "dañado"} onClick={() => setFilter("dañado")}>Dañados / en reparación</Chip>
        <Chip active={filter === "borrador"} onClick={() => setFilter("borrador")}>Borradores</Chip>
      </div>

      <div className="grid grid-cols-2 md:grid-cols-3 gap-4 mb-6">
        {filtered.map((i) => (
          <button key={i.id} onClick={() => setEditing(i)} className="text-left">
            <Panel className="overflow-hidden hover:border-ink/25 transition">
              <div className="h-28 relative">
                <ProductIllustration type={i.illustration} />
                <span className={`absolute top-2 left-2 text-[9px] font-bold px-2 py-0.5 rounded-full border ${
                  i.status === "Borrador" ? "bg-white/90 text-ink/60 border-black/15" : i.status === "Archivado" ? "bg-black/60 text-white border-black/60" : "bg-ok/90 text-white border-ok"
                }`}>{i.status || "Activo"}</span>
              </div>
              <div className="p-3">
                <div className="font-body text-sm font-semibold text-ink truncate">{i.name}</div>
                <div className="flex items-center justify-between mt-1">
                  <span className="font-display font-bold text-sm text-ink">{i.price ? fmt(i.price) : "—"}</span>
                  <span className={`font-display font-extrabold text-sm ${i.low ? "text-low" : "text-ink/60"}`}>{i.stock} u.</span>
                </div>
                <div className="flex items-center gap-1.5 mt-1.5">
                  <span className={`text-[9px] font-semibold px-1.5 py-0.5 rounded-xl border ${i.condition === "Dañado" ? "bg-low/10 text-low border-low/25" : i.condition === "En reparación" ? "bg-mustard/15 text-ink/70 border-mustard/30" : "bg-ok/10 text-ok border-ok/25"}`}>{i.condition || "Disponible"}</span>
                  {i.sku && <span className="font-body text-[9px] text-ink/35">{i.sku}</span>}
                </div>
              </div>
            </Panel>
          </button>
        ))}
      </div>

      <Panel className="overflow-hidden">
        <table className="w-full text-left">
          <thead>
            <tr className="border-b border-black/10 bg-[#FAFAF7]">
              {["Producto", "Ubicación", "Stock", "Estado del material"].map((h) => (
                <th key={h} className="px-4 py-2.5 font-body text-xs font-semibold text-muted uppercase tracking-wide">{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {filtered.map((i) => (
              <tr key={i.id} className="border-b border-black/5 last:border-0 hover:bg-black/[0.015]">
                <td className="px-4 py-3">
                  <button onClick={() => setEditing(i)} className="flex items-center gap-2.5 font-body text-sm font-semibold text-ink hover:underline">
                    <div className="w-8 h-8 rounded-xl overflow-hidden border border-black/10 flex-shrink-0"><ProductIllustration type={i.illustration} /></div>
                    {i.name}
                  </button>
                </td>
                <td className="px-4 py-3 font-body text-sm text-ink/55">
                  <span className={`text-xs font-semibold px-2 py-1 rounded-full border ${i.low ? "bg-low/10 text-low border-low/25" : "bg-black/[0.03] text-ink/60 border-black/10"}`}>
                    {i.location}
                  </span>
                </td>
                <td className={`px-4 py-3 font-display font-extrabold text-lg ${i.low ? "text-low" : "text-ink"}`}>{i.stock}</td>
                <td className="px-4 py-3">
                  <select
                    value={i.condition || "Disponible"}
                    onChange={(e) => updateCondition(i.id, e.target.value)}
                    className={`text-xs font-semibold px-2 py-1.5 rounded-xl border outline-none ${
                      i.condition === "Dañado" ? "bg-low/10 text-low border-low/25" : i.condition === "En reparación" ? "bg-mustard/15 text-ink/70 border-mustard/40" : "bg-ok/10 text-ok border-ok/25"
                    }`}
                  >
                    {CONDITIONS.map((c) => <option key={c}>{c}</option>)}
                  </select>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </Panel>

      {editing && (
        <ProductDetailModal
          product={editing}
          onClose={() => setEditing(null)}
          onSave={(updated) => updateProduct(updated)}
          flash={flash}
        />
      )}
    </div>
  );
};

const Chip = ({ children, active, onClick }) => (

        <circle cx="100" cy="45" r="6" fill="#1A1A1A" />
        <circle cx="100" cy="90" r="11" fill="#F7F4EB" stroke="#F4C430" strokeWidth="4" />
        <circle cx="100" cy="90" r="4" fill="#1A1A1A" />
      </svg>
    ),
  };
  return illustrations[type] || (
    <svg viewBox="0 0 200 140" className={className}>{bg}<rect x="70" y="45" width="60" height="50" fill="#EFEBDD" stroke="#1A1A1A" strokeWidth="2" /></svg>
  );
};

const BarChart = ({ data }) => {
  const max = Math.max(...data.map((d) => d.v));
  return (
    <div className="flex items-end gap-3 h-40 px-1">
      {data.map((d) => (
        <div key={d.d} className="flex-1 flex flex-col items-center gap-2 h-full justify-end">
          <span className="font-body text-[10px] text-muted">{fmt(d.v)}</span>
          <div className="w-full bg-ink rounded-t-xl transition-all" style={{ height: `${(d.v / max) * 100}%` }} />
          <span className="font-body text-[10px] font-semibold text-muted">{d.d}</span>
        </div>
      ))}
    </div>
  );
};

const CLIENT_SEGMENTS = ["Nuevo", "Recurrente", "VIP", "Mayorista", "Inactivo"];

const detectCardBrand = (digits) => {
  if (/^4/.test(digits)) return "Visa";
  if (/^5[1-5]/.test(digits)) return "Mastercard";
  if (/^3[47]/.test(digits)) return "American Express";
  return "Tarjeta";
};

/* Formulario de tarjeta: el número y el CVV viven solo en este estado local.
   Al guardar, se descartan — únicamente se conserva la marca, los últimos 4
   dígitos y el vencimiento (igual que hace una pasarela real al tokenizar). */
const PaymentMethodForm = ({ onSave, onCancel }) => {
  const [number, setNumber] = useState("");
  const [name, setName] = useState("");
  const [expiry, setExpiry] = useState("");
  const [cvv, setCvv] = useState("");

  const digits = number.replace(/\D/g, "");
  const valid = digits.length >= 12 && /^\d{2}\/\d{2}$/.test(expiry) && cvv.length >= 3 && name.trim();

  const save = () => {
    if (!valid) return;
    onSave({
      id: Date.now(),
      brand: detectCardBrand(digits),
      last4: digits.slice(-4),
      expiry,
      holder: name.trim(),
      isDefault: false,
    });
  };

  return (
    <Panel className="p-4 flex flex-col gap-3 bg-cream border-black/5">
      <Field label="Nombre del titular"><input value={name} onChange={(e) => setName(e.target.value)} className={inputCls} placeholder="Como figura en la tarjeta" /></Field>
      <Field label="Número de tarjeta">
        <input
          value={number}
          onChange={(e) => setNumber(e.target.value.replace(/[^\d\s]/g, "").slice(0, 19))}
          className={inputCls}
          placeholder="1234 5678 9012 3456"
          inputMode="numeric"
        />
      </Field>
      <div className="flex gap-3">
        <Field label="Vencimiento (MM/AA)"><input value={expiry} onChange={(e) => setExpiry(e.target.value)} className={`${inputCls} w-28`} placeholder="12/28" /></Field>
        <Field label="CVV"><input value={cvv} onChange={(e) => setCvv(e.target.value.replace(/\D/g, "").slice(0, 4))} type="password" className={`${inputCls} w-20`} inputMode="numeric" /></Field>
      </div>
      <p className="font-body text-[10px] text-muted leading-relaxed flex items-start gap-1.5">
        <span>🔒</span>
        <span>Estos datos se envían directo a la pasarela de pago para tokenizar la tarjeta. Quick Sale nunca guarda el número completo ni el CVV — solo la marca, los últimos 4 dígitos y el vencimiento.</span>
      </p>
      <div className="flex gap-2">
        <Btn variant="outline" className="flex-1" onClick={onCancel}>Cancelar</Btn>
        <Btn variant="primary" className="flex-1" onClick={save} disabled={!valid}>Guardar tarjeta</Btn>
      </div>
    </Panel>
  );
};

const CalendarioView = ({ inventory }) => {
  const [reservations, setReservations] = useState(RESERVATIONS);
  const [selected, setSelected] = useState("2026-09-15");
  const [itemId, setItemId] = useState(inventory[0].id);
  const [qty, setQty] = useState(1);
  const [from, setFrom] = useState("2026-09-12");
  const [to, setTo] = useState("2026-09-15");
  const [client, setClient] = useState("");
  const [error, setError] = useState("");
  const [publicView, setPublicView] = useState(false);

  const days = Array.from({ length: 30 }, (_, i) => i + 1);
  const dayIso = (d) => `2026-09-${String(d).padStart(2, "0")}`;
  const statusFor = (iso) => {
    const dayRes = reservations.filter((r) => overlaps(r.from, r.to, iso, iso));
    if (dayRes.length === 0) return null;
    const isEdge = dayRes.some((r) => r.from === iso || r.to === iso);
    return dayRes.length > 1 || !isEdge ? "busy" : "partial";
  };
  const dayReservations = reservations.filter((r) => overlaps(r.from, r.to, selected, selected));

  const submit = () => {
    setError("");
    const item = inventory.find((i) => i.id === Number(itemId));
    const overlapping = reservations.filter((r) => r.itemId === item.id && overlaps(r.from, r.to, from, to));
    const reservedQty = overlapping.reduce((a, r) => a + r.qty, 0);
    if (reservedQty + Number(qty) > item.stock) {
      setError(`No disponible — quedan ${Math.max(item.stock - reservedQty, 0)} unidades libres para esas fechas`);
      return;
    }
    setReservations((prev) => [...prev, { id: Date.now(), itemId: item.id, itemName: item.name, qty: Number(qty), from, to, client: client || "Sin nombre" }]);
    setClient("");
  };

  return (
    <div className="max-w-5xl">
      <div className="flex items-center justify-between mb-5">
        <h1 className="font-display font-extrabold text-2xl text-ink uppercase tracking-tight">Calendario · Septiembre 2026</h1>
        <Btn variant="outline" onClick={() => setPublicView(true)}>Vista pública</Btn>
      </div>
      <div className="grid grid-cols-1 lg:grid-cols-[1fr_320px] gap-6">
        <Panel className="p-5">
          <div className="grid grid-cols-7 gap-1.5 text-center mb-1.5">
            {["L", "M", "X", "J", "V", "S", "D"].map((d) => <span key={d} className="font-body text-[10px] font-bold text-ink/35">{d}</span>)}
          </div>
          <div className="grid grid-cols-7 gap-1.5">
            {days.map((d) => {

/* ---------------- DESCUENTOS ---------------- */
const DescuentosView = ({ flash }) => {
  const [discounts, setDiscounts] = useState(DISCOUNTS.map((d) => ({ ...d, active: true, uses: Math.floor(Math.random() * 20) })));
  const [name, setName] = useState("");
  const [type, setType] = useState("percent");
  const [value, setValue] = useState("");
  const [scope, setScope] = useState("General");
  const [editing, setEditing] = useState(null);
  const [scopeFilter, setScopeFilter] = useState("todos");

  const add = () => {
    if (!name.trim() || !value) return;
    setDiscounts((p) => [{ id: Date.now(), name, type, value: Number(value), scope, active: true, uses: 0 }, ...p]);
    setName(""); setValue("");
    flash("Descuento creado");
  };

  const remove = (id) => {
    setDiscounts((p) => p.filter((d) => d.id !== id));
    flash("Descuento eliminado");
  };

  const toggle = (id) => setDiscounts((p) => p.map((d) => (d.id === id ? { ...d, active: !d.active } : d)));

  const saveEdit = () => {
    setDiscounts((p) => p.map((d) => (d.id === editing.id ? editing : d)));
    setEditing(null);
    flash("Descuento actualizado");
  };

  const scopes = ["General", "Bundle", "Cliente", "Penalización"];
  const filtered = discounts.filter((d) => (scopeFilter === "todos" ? true : d.scope === scopeFilter));

  const stats = {
    activos: discounts.filter((d) => d.active).length,
    usos: discounts.reduce((a, d) => a + d.uses, 0),
  };

  return (
    <div className="max-w-5xl">
      <h1 className="font-display font-extrabold text-2xl text-ink uppercase tracking-tight mb-5">Descuentos</h1>

      <div className="grid grid-cols-3 gap-3 mb-5">
        <Panel className="p-3.5"><div className="font-display font-extrabold text-xl text-ink">{discounts.length}</div><div className="font-body text-[11px] text-muted mt-0.5">Descuentos creados</div></Panel>
        <Panel className="p-3.5"><div className="font-display font-extrabold text-xl text-ok">{stats.activos}</div><div className="font-body text-[11px] text-muted mt-0.5">Activos</div></Panel>
        <Panel className="p-3.5"><div className="font-display font-extrabold text-xl text-ink">{stats.usos}</div><div className="font-body text-[11px] text-muted mt-0.5">Usos totales</div></Panel>
      </div>

      <Panel className="p-4 mb-5 flex flex-wrap gap-3 items-end">
        <Field label="Nombre"><input value={name} onChange={(e) => setName(e.target.value)} className={`${inputCls} w-52`} placeholder="Ej. Cliente VIP" /></Field>
        <Field label="Tipo">
          <div className="flex border border-black/15 rounded-xl overflow-hidden">
            <button onClick={() => setType("percent")} className={`px-3 py-2 font-body text-sm font-semibold ${type === "percent" ? "bg-ink text-mustard" : "bg-white text-ink"}`}>%</button>
            <button onClick={() => setType("fixed")} className={`px-3 py-2 font-body text-sm font-semibold border-l border-black/15 ${type === "fixed" ? "bg-ink text-mustard" : "bg-white text-ink"}`}>$</button>
          </div>
        </Field>
        <Field label="Valor"><input value={value} onChange={(e) => setValue(e.target.value)} type="number" className={`${inputCls} w-28`} /></Field>
        <Field label="Aplica a">
          <select value={scope} onChange={(e) => setScope(e.target.value)} className={inputCls}>
            {scopes.map((s) => <option key={s}>{s}</option>)}
          </select>
        </Field>
        <Btn variant="primary" onClick={add}>+ Crear descuento</Btn>
      </Panel>

      <div className="flex gap-2 mb-4 overflow-x-auto no-scrollbar">
        <Chip active={scopeFilter === "todos"} onClick={() => setScopeFilter("todos")}>Todos</Chip>
        {scopes.map((s) => <Chip key={s} active={scopeFilter === s} onClick={() => setScopeFilter(s)}>{s}</Chip>)}
      </div>

      <Panel className="overflow-hidden">
        <table className="w-full text-left">
          <thead>
            <tr className="border-b border-black/10 bg-[#FAFAF7]">
              {["Nombre", "Tipo", "Valor", "Aplica a", "Usos", "Estado", ""].map((h) => (
                <th key={h} className="px-4 py-2.5 font-body text-xs font-semibold text-muted uppercase tracking-wide">{h}</th>
              ))}
            </tr>
          </thead>
          <tbody>
            {filtered.map((d) => (
              <tr key={d.id} className="border-b border-black/5 last:border-0 hover:bg-black/[0.015]">
                <td className="px-4 py-3">
                  <button onClick={() => setEditing(d)} className="font-body text-sm font-semibold text-ink hover:underline">{d.name}</button>
                </td>
                <td className="px-4 py-3 font-body text-sm text-ink/55">{d.type === "percent" ? "Porcentaje" : "Monto fijo"}</td>
                <td className="px-4 py-3 font-body text-sm font-semibold text-ink">{d.type === "percent" ? `${d.value}%` : fmt(d.value)}</td>
                <td className="px-4 py-3">
                  <span className="text-xs font-semibold px-2 py-1 rounded-full border bg-mustard/15 text-ink/70 border-mustard/40">{d.scope}</span>
                </td>
                <td className="px-4 py-3 font-body text-sm text-muted">{d.uses}</td>
                <td className="px-4 py-3">
                  <button onClick={() => toggle(d.id)} className={`text-xs font-semibold px-2.5 py-1 rounded-full border ${d.active ? "bg-ok/10 text-ok border-ok/30" : "bg-black/5 text-muted border-black/10"}`}>
                    {d.active ? "Activo" : "Pausado"}
                  </button>
                </td>
                <td className="px-4 py-3 text-right">
                  <button onClick={() => remove(d.id)} className="text-ink/30 hover:text-low" aria-label={`Eliminar ${d.name}`}><ITrash className="w-4 h-4" /></button>
                </td>
              </tr>
            ))}
          </tbody>
        </table>
      </Panel>

      {editing && (
        <Modal title="Editar descuento" onClose={() => setEditing(null)}>
          <div className="flex flex-col gap-3">
            <Field label="Nombre"><input value={editing.name} onChange={(e) => setEditing({ ...editing, name: e.target.value })} className={inputCls} /></Field>
            <div className="flex gap-2">
              <Field label="Tipo">
                <select value={editing.type} onChange={(e) => setEditing({ ...editing, type: e.target.value })} className={inputCls}>
                  <option value="percent">Porcentaje</option><option value="fixed">Monto fijo</option>
                </select>
              </Field>
              <Field label="Valor"><input type="number" value={editing.value} onChange={(e) => setEditing({ ...editing, value: Number(e.target.value) })} className={inputCls} /></Field>
            </div>
            <Field label="Aplica a">
              <select value={editing.scope} onChange={(e) => setEditing({ ...editing, scope: e.target.value })} className={inputCls}>
                {scopes.map((s) => <option key={s}>{s}</option>)}
              </select>
            </Field>
            <Btn variant="primary" onClick={saveEdit}>Guardar cambios</Btn>
          </div>
        </Modal>
      )}
    </div>
  );
};

const TiendaView = ({ flash }) => {

  const [showAddProduct, setShowAddProduct] = useState(false);

  const [pPrice, setPPrice] = useState("");
  const [pCat, setPCat] = useState("extras");
  const [carpa, setCarpa] = useState("c0");
  const [sillas, setSillas] = useState("s0");
  const [luz, setLuz] = useState("l0");
  const [pages, setPages] = useState(PAGES);
  const [editingPage, setEditingPage] = useState(null);
  const [deposito, setDeposito] = useState(50);
  const [metodos, setMetodos] = useState({ efectivo: true, transferencia: true, tarjeta: false });

  const filteredProducts = products.filter((p) => (cat === "todo" ? true : p.category === cat));
  const chosen = [BUNDLE_OPTIONS.carpa.find((o) => o.id === carpa), BUNDLE_OPTIONS.sillas.find((o) => o.id === sillas), BUNDLE_OPTIONS.luz.find((o) => o.id === luz)];
  const active = chosen.filter((c) => c.price > 0).length;
  const raw = chosen.reduce((a, c) => a + c.price, 0);
  const pct = active >= 3 ? 10 : active === 2 ? 5 : 0;

  const addProduct = () => {
    if (!pName.trim() || !pPrice) return;
    setProducts((prev) => [{ id: Date.now(), name: pName, price: Number(pPrice), category: pCat }, ...prev]);
    setPName(""); setPPrice(""); setShowAddProduct(false);
    flash("Producto agregado al catálogo");

  const savePage = () => {
    setPages((prev) => prev.map((p) => (p.id === editingPage.id ? editingPage : p)));
    setEditingPage(null);
    flash("Página actualizada");
  };

  const saveCheckout = () => flash(`Checkout guardado: seña ${deposito}%`);

              <Chip active={cat === "extras"} onClick={() => setCat("extras")}>Extras</Chip>
            </div>
            <Btn variant="primary" onClick={() => setShowAddProduct((s) => !s)}>{showAddProduct ? "Cancelar" : "+ Añadir al catálogo"}</Btn>
          </div>
          {showAddProduct && (
            <Panel className="p-4 mb-4 flex flex-wrap gap-3 items-end">
              <Field label="Nombre"><input value={pName} onChange={(e) => setPName(e.target.value)} className={`${inputCls} w-52`} /></Field>

            <div className="font-body text-[11px] font-semibold uppercase tracking-wide text-muted mb-2">Métodos de pago aceptados</div>
            {Object.entries(metodos).map(([k, v]) => (
              <label key={k} className="flex items-center justify-between py-2 border-b border-black/5 last:border-0">
                <span className="font-body text-sm text-ink capitalize">{k}</span>
                <input type="checkbox" checked={v} onChange={() => setMetodos((m) => ({ ...m, [k]: !m[k] }))} className="w-4 h-4 accent-ink" />
              </label>
            ))}
          </div>
          <Btn variant="primary" onClick={saveCheckout}>Guardar cambios</Btn>
        </Panel>
      )}

};

/* ---------------- BORRADORES DE PEDIDOS ---------------- */
const BorradoresView = ({ onConvert, flash }) => {
  const [drafts, setDrafts] = useState(INITIAL_DRAFTS);
  const [show, setShow] = useState(false);
  const [client, setClient] = useState("");
  const [total, setTotal] = useState("");
  const [date, setDate] = useState("");
  const [query, setQuery] = useState("");

  const add = () => {
    if (!client.trim() || !total) return;
    setDrafts((p) => [{ id: `#B-${Math.floor(Math.random() * 900 + 100)}`, client, total: Number(total), date: date || "Sin fecha", note: "" }, ...p]);
    setClient(""); setTotal(""); setDate(""); setShow(false);
    flash("Presupuesto creado");
  };

  const convert = (d) => {
    setDrafts((p) => p.filter((x) => x.id !== d.id));
    onConvert({
      id: `#${Math.floor(1000 + Math.random() * 9000)}`, client: d.client, date: d.date, total: d.total,
      deposit: Math.round(d.total * 0.3), depositStatus: "Pendiente", status: "Pendiente", fulfillment: "Pendiente de entrega",
      paymentMethod: "", email: "", phone: "", items: [], tags: ["desde borrador"], notes: [],
    });
    flash(`${d.id} convertido en pedido`);
  };

  const remove = (id) => {
    setDrafts((p) => p.filter((d) => d.id !== id));
    flash("Presupuesto eliminado");
  };

  const filtered = drafts.filter((d) => d.client.toLowerCase().includes(query.toLowerCase()) || d.id.toLowerCase().includes(query.toLowerCase()));
  const totalEstimado = drafts.reduce((a, d) => a + d.total, 0);

  return (
    <div className="max-w-5xl">
      <div className="flex items-center justify-between mb-5">
        <h1 className="font-display font-extrabold text-2xl text-ink uppercase tracking-tight">Borradores de pedidos</h1>
        <Btn variant="primary" onClick={() => setShow((s) => !s)}>{show ? "Cancelar" : "+ Nuevo presupuesto"}</Btn>
      </div>
      <p className="font-body text-sm text-muted mb-5 -mt-3">Presupuestos y cotizaciones que aún no se confirmaron como pedido.</p>

      <div className="grid grid-cols-2 gap-3 mb-5">
        <Panel className="p-3.5"><div className="font-display font-extrabold text-xl text-ink">{drafts.length}</div><div className="font-body text-[11px] text-muted mt-0.5">Presupuestos abiertos</div></Panel>
        <Panel className="p-3.5"><div className="font-display font-extrabold text-xl text-ink">{fmt(totalEstimado)}</div><div className="font-body text-[11px] text-muted mt-0.5">Valor estimado total</div></Panel>
      </div>

      {show && (
        <Panel className="p-4 mb-5 flex flex-wrap gap-3 items-end">
          <Field label="Cliente / evento"><input value={client} onChange={(e) => setClient(e.target.value)} className={`${inputCls} w-56`} /></Field>
          <Field label="Total estimado"><input value={total} onChange={(e) => setTotal(e.target.value)} type="number" className={`${inputCls} w-32`} /></Field>
          <Field label="Fecha del evento"><input value={date} onChange={(e) => setDate(e.target.value)} className={`${inputCls} w-40`} placeholder="Ej. 20 oct 2026" /></Field>
          <Btn variant="primary" onClick={add}>Guardar presupuesto</Btn>
        </Panel>
      )}

      {drafts.length > 0 && (
        <div className="relative mb-4 max-w-xs">
          <ISearch className="w-3.5 h-3.5 text-ink/35 absolute left-3 top-1/2 -translate-y-1/2" />
          <input value={query} onChange={(e) => setQuery(e.target.value)} placeholder="Buscar presupuesto..." className={`${inputCls} w-full pl-8`} />
        </div>
      )}

      {filtered.length === 0 ? (
        <Panel className="p-10 text-center"><p className="font-body text-sm text-muted">No hay presupuestos pendientes</p></Panel>
      ) : (
        <div className="flex flex-col gap-3">
          {filtered.map((d) => (
            <Panel key={d.id} className="p-4 flex items-center justify-between flex-wrap gap-3">
              <div>
                <div className="font-body text-sm font-semibold text-ink">{d.id} · {d.client}</div>
                <div className="font-body text-xs text-muted mt-0.5">{d.date}{d.note ? ` · ${d.note}` : ""}</div>
              </div>
              <div className="flex items-center gap-3">
                <span className="font-display font-extrabold text-base text-ink">{fmt(d.total)}</span>
                <Btn variant="outline" onClick={() => remove(d.id)}>Eliminar</Btn>
                <Btn variant="primary" onClick={() => convert(d)}>Convertir en pedido</Btn>
              </div>
            </Panel>
          ))}
        </div>
      )}
    </div>
  );
};

/* ---------------- BANDEJA DE ENTRADA ---------------- */
const BandejaView = () => {
  const [conversations, setConversations] = useState(INBOX_CONVERSATIONS);
  const [activeId, setActiveId] = useState(INBOX_CONVERSATIONS[0]?.id);
  const [reply, setReply] = useState("");

  const active = conversations.find((c) => c.id === activeId);

  const send = () => {
    if (!reply.trim() || !active) return;
    setConversations((prev) => prev.map((c) => (
      c.id === activeId
        ? { ...c, messages: [...c.messages, { from: "store", text: reply, time: "Ahora" }], lastMessage: reply, unread: false }
        : c
    )));
    setReply("");
  };

  const openConv = (id) => {
    setActiveId(id);
    setConversations((prev) => prev.map((c) => (c.id === id ? { ...c, unread: false } : c)));
  };

  return (
    <div className="max-w-5xl">
      <h1 className="font-display font-extrabold text-2xl text-ink uppercase tracking-tight mb-5">Bandeja de entrada</h1>
      <Panel className="overflow-hidden">
        <div className="grid grid-cols-1 md:grid-cols-[240px_1fr] min-h-[420px]">
          <div className="border-b md:border-b-0 md:border-r border-black/10 overflow-y-auto">
            {conversations.map((c) => (
              <button
                key={c.id}
                onClick={() => openConv(c.id)}
                className={`w-full text-left px-4 py-3 border-b border-black/5 last:border-0 ${activeId === c.id ? "bg-cream" : "hover:bg-black/[0.02]"}`}
              >
                <div className="flex items-center justify-between">
                  <span className="font-body text-sm font-semibold text-ink truncate">{c.client}</span>
                  {c.unread && <span className="w-2 h-2 rounded-full bg-low flex-shrink-0" />}
                </div>
                <div className="font-body text-xs text-muted truncate mt-0.5">{c.lastMessage}</div>
                <div className="flex items-center justify-between mt-1">
                  <span className="text-[9px] font-semibold px-1.5 py-0.5 rounded-xl border bg-black/[0.03] text-muted border-black/10">{c.channel}</span>
                  <span className="font-body text-[10px] text-ink/35">{c.time}</span>
                </div>
              </button>
            ))}
          </div>

          <div className="flex flex-col">
            {active ? (
              <>
                <div className="px-4 py-3 border-b border-black/10">
                  <div className="font-body text-sm font-semibold text-ink">{active.client}</div>
                  <div className="font-body text-[11px] text-muted">vía {active.channel}</div>
                </div>
                <div className="flex-1 p-4 flex flex-col gap-2 overflow-y-auto max-h-72">
                  {active.messages.map((m, idx) => (
                    <div key={idx} className={`max-w-[75%] px-3 py-2 rounded-xl font-body text-sm ${m.from === "store" ? "self-end bg-ink text-cream" : "self-start bg-cream text-ink"}`}>
                      {m.text}
                      <div className={`text-[10px] mt-1 ${m.from === "store" ? "text-cream/50" : "text-ink/35"}`}>{m.time}</div>
                    </div>
                  ))}
                </div>
                <div className="p-3 border-t border-black/10 flex gap-2">
                  <input value={reply} onChange={(e) => setReply(e.target.value)} onKeyDown={(e) => e.key === "Enter" && send()} placeholder="Escribir una respuesta..." className={`${inputCls} flex-1`} />
                  <Btn variant="primary" onClick={send}>Enviar</Btn>
                </div>
              </>
            ) : (
              <div className="flex-1 flex items-center justify-center font-body text-sm text-muted">Elegí una conversación</div>
            )}
          </div>
        </div>
      </Panel>
    </div>
  );
};

/* ---------------- COLECCIONES ---------------- */
const ColeccionesView = ({ inventory, flash }) => {
  const [collections, setCollections] = useState(COLLECTIONS.map((c) => ({ ...c, productIds: [] })));
  const [name, setName] = useState("");
  const [showForm, setShowForm] = useState(false);
  const [editing, setEditing] = useState(null);

  const add = () => {
    if (!name.trim()) return;
    setCollections((p) => [{ id: Date.now(), name, count: 0, productIds: [] }, ...p]);
    setName(""); setShowForm(false);
    flash("Colección creada");
  };

  const remove = (id) => {
    setCollections((p) => p.filter((c) => c.id !== id));
    setEditing(null);
    flash("Colección eliminada");
  };

  const toggleProduct = (productId) => {
    setEditing((e) => {
      const has = e.productIds.includes(productId);
      const productIds = has ? e.productIds.filter((id) => id !== productId) : [...e.productIds, productId];
      return { ...e, productIds };
    });
  };

  const saveEdit = () => {
    setCollections((p) => p.map((c) => (c.id === editing.id ? { ...editing, count: editing.productIds.length } : c)));
    setEditing(null);
    flash("Colección actualizada");
  };

  return (
    <div className="max-w-5xl">
      <div className="flex items-center justify-between mb-5">
        <h1 className="font-display font-extrabold text-2xl text-ink uppercase tracking-tight">Colecciones</h1>
        <Btn variant="primary" onClick={() => setShowForm((s) => !s)}>{showForm ? "Cancelar" : "+ Crear colección"}</Btn>
      </div>
      {showForm && (
        <Panel className="p-4 mb-5 flex gap-3 items-end">
          <Field label="Nombre"><input value={name} onChange={(e) => setName(e.target.value)} className={`${inputCls} w-64`} placeholder="Ej. Packs de cumpleaños" /></Field>
          <Btn variant="primary" onClick={add}>Guardar</Btn>
        </Panel>
      )}
      <div className="grid grid-cols-3 gap-4">
        {collections.map((c) => (
          <button key={c.id} onClick={() => setEditing(c)} className="text-left">
            <Panel className="p-4 hover:border-ink/25 transition">
              {c.productIds.length > 0 ? (
                <div className="grid grid-cols-3 gap-1 h-20 mb-3 rounded-xl overflow-hidden">
                  {c.productIds.slice(0, 3).map((pid) => {
                    const prod = inventory.find((i) => i.id === pid);
                    return <div key={pid} className="bg-cream"><ProductIllustration type={prod?.illustration} /></div>;
                  })}
                </div>
              ) : (
                <div className="w-full h-20 rounded-xl bg-gradient-to-br from-cream to-mustard/25 mb-3" />
              )}
              <div className="font-body text-sm font-semibold text-ink">{c.name}</div>
              <div className="font-body text-xs text-muted mt-0.5">{c.productIds.length} productos</div>
            </Panel>
          </button>
        ))}
      </div>

      {editing && (
        <Modal title={`Editar: ${editing.name}`} onClose={() => setEditing(null)} wide>
          <div className="flex flex-col gap-4">
            <Field label="Nombre de la colección"><input value={editing.name} onChange={(e) => setEditing({ ...editing, name: e.target.value })} className={inputCls} /></Field>
            <div>
              <div className="font-body text-[11px] font-semibold uppercase tracking-wide text-muted mb-2">Productos incluidos</div>
              <div className="grid grid-cols-2 gap-2 max-h-72 overflow-y-auto">
                {inventory.map((p) => {
                  const checked = editing.productIds.includes(p.id);
                  return (
                    <button key={p.id} onClick={() => toggleProduct(p.id)} className={`flex items-center gap-2.5 p-2 rounded-xl border text-left ${checked ? "bg-mustard/15 border-ink" : "border-black/10"}`}>
                      <div className="w-9 h-9 rounded-xl overflow-hidden border border-black/10 flex-shrink-0"><ProductIllustration type={p.illustration} /></div>
                      <span className="font-body text-xs font-semibold text-ink flex-1 truncate">{p.name}</span>
                      {checked && <span className="text-ok font-bold flex-shrink-0">✓</span>}
                    </button>
                  );
                })}
              </div>
            </div>
            <div className="flex gap-2">
              <Btn variant="outline" className="flex-1" onClick={() => remove(editing.id)}>Eliminar colección</Btn>
              <Btn variant="primary" className="flex-1" onClick={saveEdit}>Guardar cambios</Btn>
            </div>
          </div>
