const CountdownTimer = ({ className = "" }) => {
  const getRemaining = () => {
    const now = new Date();
    const end = new Date(now);
    end.setHours(23, 59, 59, 999);
    return Math.max(0, end - now);
  };
  const [remaining, setRemaining] = useState(getRemaining());
  useEffect(() => {
    const id = setInterval(() => setRemaining(getRemaining()), 1000);
    return () => clearInterval(id);
  }, []);
  const pad = (n) => String(n).padStart(2, "0");
  const h = pad(Math.floor(remaining / 3600000));
  const m = pad(Math.floor((remaining % 3600000) / 60000));
  const s = pad(Math.floor((remaining % 60000) / 1000));
  return (
    <div className={`flex items-center gap-1 ${className}`}>
      {[h, m, s].map((unit, idx) => (
        <React.Fragment key={idx}>
          {idx > 0 && <span className="font-display font-bold text-mustard">:</span>}
          <span className="font-display font-bold bg-cream/10 rounded-lg px-1.5 py-0.5 tabular-nums">{unit}</span>
        </React.Fragment>
      ))}
    </div>
  );
};

  const items = getNotificationItems(orders).slice(0, 4);

      <button

const SignaturePad = ({ onSign, signed }) => {
  const canvasRef = useRef(null);
  const drawing = useRef(false);

  const pos = (e, canvas) => {
    const rect = canvas.getBoundingClientRect();
    const p = e.touches ? e.touches[0] : e;
    return { x: p.clientX - rect.left, y: p.clientY - rect.top };
  };

  const start = (e) => { drawing.current = true; draw(e); };
  const end = () => { drawing.current = false; };
  const draw = (e) => {
    if (!drawing.current) return;
    const canvas = canvasRef.current;
    const ctx = canvas.getContext("2d");
    const { x, y } = pos(e, canvas);
    ctx.fillStyle = "#1A1A1A";
    ctx.beginPath();
    ctx.arc(x, y, 1.6, 0, Math.PI * 2);
    ctx.fill();
  };
  const clear = () => {
    const canvas = canvasRef.current;
    canvas.getContext("2d").clearRect(0, 0, canvas.width, canvas.height);
  };

  return (
    <div>
      <canvas
        ref={canvasRef}
        width={340}
        height={140}
        className="w-full bg-cream border-2 border-dashed border-ink/30 rounded-xl touch-none"
        onMouseDown={start} onMouseUp={end} onMouseLeave={end} onMouseMove={draw}
        onTouchStart={start} onTouchEnd={end} onTouchMove={draw}
      />
      <div className="flex gap-2 mt-2">
        <Button variant="ghost" className="flex-1" onClick={clear}>Limpiar firma</Button>
        <Button variant="accent" className="flex-1" onClick={() => onSign(canvasRef.current.toDataURL())}>Firmar contrato</Button>
      </div>
    </div>
  );
};

const ProductDetailScreen = ({ product, cart, onBack, onAdd, onOpenDetail, flash }) => {

  const add = () => {
    if (qty <= 0) return;
    for (let i = 0; i < qty; i++) onAdd(product);
    flash(`${product.name} agregado${qty > 1 ? ` (x${qty})` : ""}`);
    onBack();

  return (
    <div className="pb-28">

      <div className="h-56 relative">

            <span className="bg-mustardDark text-ink text-[10px] font-display font-bold px-2 py-0.5 rounded-full">
              -{Math.round((1 - product.price / product.compareAtPrice) * 100)}%

          <div className="flex items-center border-2 border-ink rounded-xl">
            <button onClick={() => setQty((q) => Math.max(1, q - 1))} disabled={qty <= 1} className="w-9 h-9 flex items-center justify-center font-display font-bold text-ink disabled:opacity-30 disabled:cursor-not-allowed">−</button>
            <span className="w-8 text-center font-display font-bold text-ink">{qty}</span>
            <button
              onClick={() => setQty((q) => (remaining === null ? q + 1 : Math.min(q + 1, remaining)))}

/* ---------------- BUNDLE BUILDER ---------------- */
const BundleScreen = ({ onBack, onAddBundle }) => {
  const [carpa, setCarpa] = useState("c0");
  const [sillas, setSillas] = useState("s0");
  const [luz, setLuz] = useState("l0");

  const chosen = [
    BUNDLE_OPTIONS.carpa.find((o) => o.id === carpa),
    BUNDLE_OPTIONS.sillas.find((o) => o.id === sillas),
    BUNDLE_OPTIONS.luz.find((o) => o.id === luz),
  ];
  const activeCount = chosen.filter((c) => c.price > 0).length;
  const rawTotal = chosen.reduce((a, c) => a + c.price, 0);
  const discountPct = activeCount >= 3 ? 10 : activeCount === 2 ? 5 : 0;
  const discount = Math.round((rawTotal * discountPct) / 100);
  const finalTotal = rawTotal - discount;

  const Group = ({ title, options, value, onChange, illustration }) => (
    <div className="mb-4">
      <div className="font-body text-[10px] font-bold uppercase tracking-wide text-muted mb-1.5">{title}</div>
      <div className="flex flex-col gap-2">
        {options.map((o) => (
          <button key={o.id} onClick={() => onChange(o.id)} className="w-full text-left">
            <Card className={`p-2.5 flex items-center gap-3 ${value === o.id ? "bg-mustard/20 border-ink" : ""}`}>
              <div className="w-11 h-11 rounded-xl overflow-hidden border border-ink/10 flex-shrink-0">
                <ProductIllustration type={o.price > 0 ? illustration : "none"} />
              </div>
              <span className="font-body text-sm font-medium flex-1">{o.label}</span>
              <div className="flex items-center gap-2">
                <span className="font-display font-bold text-sm">{o.price > 0 ? fmt(o.price) : "—"}</span>
                <span className={`w-4 h-4 rounded-full border-2 border-ink flex-shrink-0 ${value === o.id ? "bg-ink" : "bg-white"}`} />
              </div>
            </Card>
          </button>
        ))}
      </div>
    </div>
  );

  return (
    <div className="px-4 pt-6 pb-28">
      <ToolHeader title="Armá tu paquete" onBack={onBack} />
      <Group title="Carpa" options={BUNDLE_OPTIONS.carpa} value={carpa} onChange={setCarpa} illustration="tent" />
      <Group title="Sillas" options={BUNDLE_OPTIONS.sillas} value={sillas} onChange={setSillas} illustration="chairs" />
      <Group title="Iluminación" options={BUNDLE_OPTIONS.luz} value={luz} onChange={setLuz} illustration="lights" />

      <Card className="p-4 bg-ink border-ink">
        <div className="flex justify-between font-body text-xs text-cream/60 py-1">
          <span>Subtotal ({activeCount} componentes)</span><span>{fmt(rawTotal)}</span>
        </div>
        {discountPct > 0 && (
          <div className="flex justify-between font-body text-xs text-mustard py-1">
            <span>Descuento por volumen -{discountPct}%</span><span>-{fmt(discount)}</span>
          </div>
        )}
        <div className="flex justify-between font-display font-extrabold text-base text-mustard pt-2 mt-1 border-t border-dashed border-cream/20">
          <span>Total del paquete</span><span>{fmt(finalTotal)}</span>
        </div>
      </Card>

      <Button
        variant="accent"
        className="w-full mt-4"
        onClick={() => {
          if (activeCount === 0) return;
          onAddBundle({
            id: Date.now(),
            name: `Paquete a medida (${chosen.filter((c) => c.price > 0).map((c) => c.label).join(" + ")})`,
            price: finalTotal,
            illustration: carpa !== "c0" ? "tent" : sillas !== "s0" ? "chairs" : "lights",
          });
          onBack();
        }}
      >
        Agregar paquete al carrito
      </Button>
    </div>
  );
};

const CUSTOMER_TYPES = [
  { id: "particular", label: "Particular", desc: "Estoy organizando mi propio evento", discountPct: 0 },
  { id: "organizador", label: "Organizador de eventos", desc: "Soy wedding planner, coordinador o productor", discountPct: 5 },
  { id: "corporativo", label: "Empresa / Corporativo", desc: "Compro para eventos de mi empresa", discountPct: 8 },
  { id: "mayorista", label: "Mayorista / Revendedor", desc: "Alquilo en volumen para revender", discountPct: 15 },
];

const RegistroScreen = ({ onBack, customer, onSave, flash, orders }) => {
  const [name, setName] = useState(customer?.name || "");
  const [email, setEmail] = useState(customer?.email || "");
  const [phone, setPhone] = useState(customer?.phone || "");
  const [typeId, setTypeId] = useState(customer?.typeId || "particular");

  const save = () => {
    if (!name.trim() || !email.trim()) return;
    const type = CUSTOMER_TYPES.find((t) => t.id === typeId);
    const referralCode = customer?.referralCode || `REF-${name.trim().split(" ")[0].toUpperCase().replace(/[^A-Z]/g, "").slice(0, 8)}${Math.floor(100 + Math.random() * 900)}`;
    onSave({ name: name.trim(), email: email.trim(), phone: phone.trim(), typeId, label: type.label, discountPct: type.discountPct, referralCode });
    flash(type.discountPct > 0 ? `¡Registrado! Tenés ${type.discountPct}% de descuento en tus compras` : "Registro guardado");
    onBack();
  };

  const copyReferral = async () => {
    if (navigator.clipboard) {
      await navigator.clipboard.writeText(customer.referralCode);
      flash("Código copiado");
    }
  };

  const downloadInvoice = (o) => {
    const { jsPDF } = window.jspdf;
    const doc = new jsPDF();
    doc.setFontSize(18); doc.text("Factura — Quick Sale", 14, 20);
    doc.setFontSize(11);
    doc.text(`Pedido: ${o.id}`, 14, 34);
    doc.text(`Fecha: ${o.date}`, 14, 41);
    doc.text(`Total: ${fmt(o.total)}  |  Pagado: ${fmt(o.paid)}`, 14, 48);
    doc.text(`Cliente: ${o.client}`, 14, 55);
    let y = 66;
    (o.items || []).forEach((it) => { doc.text(`- ${it.qty}x ${it.name} — ${fmt(it.price * it.qty)}`, 14, y); y += 7; });
    doc.save(`factura-${o.id.replace("#", "")}.pdf`);
    flash("Factura descargada");
  };

  return (
    <div className="px-4 pt-6 pb-28">
      <ToolHeader title="Mi registro" onBack={onBack} />
      <p className="font-body text-sm text-muted mb-4 -mt-2">Contanos para qué necesitás el alquiler y te aplicamos el descuento que corresponda en cada compra.</p>

      <Card className="p-4 mb-5 flex flex-col gap-3">
        <div>
          <label className="font-body text-[10px] font-bold uppercase tracking-wide text-muted">Nombre completo</label>
          <input value={name} onChange={(e) => setName(e.target.value)} placeholder="Tu nombre" className="mt-1 w-full bg-cream border-2 border-ink/10 rounded-xl px-3 py-2.5 font-body text-sm outline-none" />
        </div>
        <div>
          <label className="font-body text-[10px] font-bold uppercase tracking-wide text-muted">Email</label>
          <input value={email} onChange={(e) => setEmail(e.target.value)} type="email" placeholder="tu@email.com" className="mt-1 w-full bg-cream border-2 border-ink/10 rounded-xl px-3 py-2.5 font-body text-sm outline-none" />
        </div>
        <div>
          <label className="font-body text-[10px] font-bold uppercase tracking-wide text-muted">Teléfono (opcional)</label>
          <input value={phone} onChange={(e) => setPhone(e.target.value)} placeholder="+54 9 ..." className="mt-1 w-full bg-cream border-2 border-ink/10 rounded-xl px-3 py-2.5 font-body text-sm outline-none" />
        </div>
      </Card>

      <div className="font-body text-[10px] font-bold uppercase tracking-wide text-muted mb-2">¿Para qué necesitás el alquiler?</div>
      <div className="flex flex-col gap-2 mb-5">
        {CUSTOMER_TYPES.map((t) => (
          <button key={t.id} onClick={() => setTypeId(t.id)} className="text-left">
            <Card className={`p-3.5 ${typeId === t.id ? "bg-mustard/15 border-ink" : ""}`}>
              <div className="flex items-center justify-between">
                <span className="font-display font-bold text-sm text-ink">{t.label}</span>
                {t.discountPct > 0 && (
                  <span className="text-[10px] font-bold px-2 py-0.5 rounded-full bg-ok/10 text-ok border border-ok/30">-{t.discountPct}%</span>
                )}
              </div>
              <p className="font-body text-xs text-muted mt-1">{t.desc}</p>
            </Card>
          </button>
        ))}
      </div>

      <Button variant="accent" className="w-full mb-6" onClick={save}>Guardar y aplicar descuento</Button>

      {customer?.referralCode && (
        <>
          <div className="font-body text-[10px] font-bold uppercase tracking-wide text-muted mb-2">Invitá a un amigo</div>
          <Card className="p-4 mb-6 bg-ink border-ink">
            <p className="font-body text-xs text-cream/60 mb-2">Compartí tu código — tu amigo obtiene {REFERRAL_DISCOUNT_PCT}% de descuento en su primera compra.</p>
            <div className="flex items-center justify-between bg-cream/10 rounded-xl px-3 py-2.5">
              <span className="font-display font-bold text-mustard tracking-wide">{customer.referralCode}</span>
              <button onClick={copyReferral} className="font-body text-xs font-semibold text-cream/80 hover:text-cream">Copiar</button>
            </div>
          </Card>
        </>
      )}

      <div className="font-body text-[10px] font-bold uppercase tracking-wide text-muted mb-2">Mis facturas y contratos</div>
      {orders.length === 0 ? (
        <Card className="p-6 text-center">
          <p className="font-body text-sm text-muted">Todavía no tenés pedidos facturados</p>
        </Card>
      ) : (
        <div className="flex flex-col gap-2">
          {orders.map((o) => (
            <Card key={o.id} className="p-3.5 flex items-center justify-between">
              <div>
                <div className="font-body text-sm font-semibold text-ink">{o.id} · {fmt(o.total)}</div>
                <div className="font-body text-[11px] text-muted mt-0.5">{o.date}</div>
              </div>
              <button onClick={() => downloadInvoice(o)} className="flex items-center gap-1.5 font-body text-xs font-semibold text-ink/60 hover:text-ink flex-shrink-0">
                <IconFile className="w-3.5 h-3.5" /> Factura
              </button>
            </Card>
          ))}
        </div>
      )}
    </div>
  );
};

const REFERRAL_DISCOUNT_PCT = 5;

const PAYMENT_METHODS = [
  { id: "mercadopago", label: "Mercado Pago", desc: "Tarjeta de crédito o débito", Icon: IconCard },
  { id: "transferencia", label: "Transferencia bancaria", desc: "CBU / alias", Icon: IconBank },
  { id: "efectivo", label: "Efectivo al retirar", desc: "Pagás en el evento", Icon: IconCash },
];

const BUSINESS_TRANSFER_INFO = { titular: "Quick Sale SRL", alias: "quicksale.eventos", cbu: "0000003100012345678901", banco: "Banco Nación" };

const getPaymentStatus = (paymentMethod, mode) => {
  if (paymentMethod === "mercadopago") {
    return { status: mode === "seña" ? "Seña pagada" : "Pago total", paymentConfirmed: true, liveStep: 1 };
  }
  if (paymentMethod === "transferencia") {
    return { status: "Transferencia pendiente de confirmar", paymentConfirmed: false, liveStep: 0 };
  }
  return { status: "Efectivo pendiente de confirmar", paymentConfirmed: false, liveStep: 0 };
};

const PaymentGatewayScreen = ({ amount, label, onSuccess, onCancel }) => {
  const [step, setStep] = useState("method"); // method | card | transfer_form | cash_confirm | processing | success
  const [method, setMethod] = useState(null);
  const [holder, setHolder] = useState("");
  const [number, setNumber] = useState("");
  const [expiry, setExpiry] = useState("");
  const [cvv, setCvv] = useState("");
  const [transferHolder, setTransferHolder] = useState("");
  const [transferBank, setTransferBank] = useState("");
  const [transferRef, setTransferRef] = useState("");

  const chooseMethod = (m) => {
    setMethod(m);
    if (m.id === "mercadopago") setStep("card");
    else if (m.id === "transferencia") setStep("transfer_form");
    else setStep("cash_confirm");
  };

  const submitCard = () => {
    if (!holder.trim() || number.replace(/\D/g, "").length < 12 || !expiry || cvv.length < 3) return;
    // El número y el CVV nunca se guardan — solo se usan para simular el envío a la pasarela.
    setStep("processing");
    setTimeout(() => setStep("success"), 1400);
  };

  const submitTransfer = () => {
    if (!transferHolder.trim() || !transferBank.trim()) return;
    setStep("processing");
    setTimeout(() => setStep("success"), 1100);
  };

  const confirmCash = () => {
    setStep("processing");
    setTimeout(() => setStep("success"), 800);
  };

  const finish = () => onSuccess(method?.id, method?.id === "transferencia" ? { holder: transferHolder, bank: transferBank, ref: transferRef.trim() } : null);

  return (
    <div className="fixed inset-0 z-50 bg-cream overflow-y-auto">
      <div className="max-w-md mx-auto px-4 pt-6 pb-10 min-h-screen flex flex-col">
        {step !== "processing" && step !== "success" && (
          <button
            onClick={() => (step === "method" ? onCancel() : setStep("method"))}
            className="w-8 h-8 flex items-center justify-center bg-white border-2 border-ink rounded-xl mb-4 flex-shrink-0"
            aria-label={step === "method" ? "Cancelar pago" : "Volver a métodos de pago"}
          >
            {step === "method" ? <IconX className="w-4 h-4 text-ink" /> : <IconBack className="w-4 h-4 text-ink" />}
          </button>
        )}

        {step === "method" && (
          <>
            <h1 className="font-display font-extrabold text-xl text-ink mb-1">{label}</h1>
            <p className="font-body text-sm text-muted mb-5">Vas a pagar <span className="font-semibold text-ink">{fmt(amount)}</span></p>
            <div className="flex flex-col gap-2">
              {PAYMENT_METHODS.map((m) => (
                <button key={m.id} onClick={() => chooseMethod(m)} className="text-left">
                  <Card className="p-4 flex items-center gap-3">
                    <div className="w-10 h-10 rounded-xl bg-cream flex items-center justify-center flex-shrink-0">
                      <m.Icon className="w-5 h-5 text-ink" />
                    </div>
                    <div className="flex-1">
                      <div className="font-display font-bold text-sm text-ink">{m.label}</div>
                      <div className="font-body text-xs text-muted">{m.desc}</div>
                    </div>
                    <IconChevron className="w-4 h-4 text-ink/30" />
                  </Card>
                </button>
              ))}
            </div>
          </>
        )}

        {step === "card" && (
          <>
            <h1 className="font-display font-extrabold text-xl text-ink mb-1">Pagar con tarjeta</h1>
            <p className="font-body text-sm text-muted mb-5">{fmt(amount)} vía Mercado Pago</p>
            <Card className="p-4 flex flex-col gap-3">
              <div>
                <label className="font-body text-[10px] font-bold uppercase tracking-wide text-muted">Nombre del titular</label>
                <input value={holder} onChange={(e) => setHolder(e.target.value)} className="mt-1 w-full bg-cream border-2 border-ink/10 rounded-xl px-3 py-2.5 font-body text-sm outline-none" />
              </div>
              <div>
                <label className="font-body text-[10px] font-bold uppercase tracking-wide text-muted">Número de tarjeta</label>
                <input
                  value={number}
                  onChange={(e) => setNumber(e.target.value.replace(/[^\d\s]/g, "").slice(0, 19))}
                  placeholder="1234 5678 9012 3456"
                  inputMode="numeric"
                  className="mt-1 w-full bg-cream border-2 border-ink/10 rounded-xl px-3 py-2.5 font-body text-sm outline-none"
                />
              </div>
              <div className="flex gap-3">
                <div className="flex-1">
                  <label className="font-body text-[10px] font-bold uppercase tracking-wide text-muted">Vencimiento</label>
                  <input value={expiry} onChange={(e) => setExpiry(e.target.value)} placeholder="MM/AA" className="mt-1 w-full bg-cream border-2 border-ink/10 rounded-xl px-3 py-2.5 font-body text-sm outline-none" />
                </div>
                <div className="w-24">
                  <label className="font-body text-[10px] font-bold uppercase tracking-wide text-muted">CVV</label>
                  <input value={cvv} onChange={(e) => setCvv(e.target.value.replace(/\D/g, "").slice(0, 4))} type="password" inputMode="numeric" className="mt-1 w-full bg-cream border-2 border-ink/10 rounded-xl px-3 py-2.5 font-body text-sm outline-none" />
                </div>
              </div>
              <p className="font-body text-[10px] text-muted leading-relaxed flex items-start gap-1.5">
                <IconLock className="w-3.5 h-3.5 flex-shrink-0 mt-0.5" /><span>Tus datos se envían directo a Mercado Pago para procesar el cobro. No los guardamos.</span>
              </p>
            </Card>
            <Button variant="accent" className="w-full mt-4" onClick={submitCard}>Pagar {fmt(amount)}</Button>
          </>
        )}

        {step === "transfer_form" && (
          <>
            <h1 className="font-display font-extrabold text-xl text-ink mb-1">Transferencia bancaria</h1>
            <p className="font-body text-sm text-muted mb-4">Transferí {fmt(amount)} a esta cuenta y después completá tus datos para que podamos identificar el pago.</p>

            <Card className="p-4 flex flex-col divide-y divide-dashed divide-ink/10 mb-4">
              {Object.entries({ Titular: BUSINESS_TRANSFER_INFO.titular, Banco: BUSINESS_TRANSFER_INFO.banco, Alias: BUSINESS_TRANSFER_INFO.alias, CBU: BUSINESS_TRANSFER_INFO.cbu }).map(([k, v]) => (
                <div key={k} className="flex justify-between py-1.5 first:pt-0 last:pb-0 font-body text-xs">
                  <span className="text-muted">{k}</span><span className="font-semibold text-ink">{v}</span>
                </div>
              ))}
            </Card>

            <div className="font-body text-[10px] font-bold uppercase tracking-wide text-muted mb-2">Tus datos para identificar la transferencia</div>
            <Card className="p-4 flex flex-col gap-3">
              <div>
                <label className="font-body text-[10px] font-bold uppercase tracking-wide text-muted">Nombre del titular que transfiere</label>
                <input value={transferHolder} onChange={(e) => setTransferHolder(e.target.value)} className="mt-1 w-full bg-cream border-2 border-ink/10 rounded-xl px-3 py-2.5 font-body text-sm outline-none" />
              </div>
              <div>
                <label className="font-body text-[10px] font-bold uppercase tracking-wide text-muted">Banco emisor</label>
                <input value={transferBank} onChange={(e) => setTransferBank(e.target.value)} placeholder="Ej. Banco Galicia" className="mt-1 w-full bg-cream border-2 border-ink/10 rounded-xl px-3 py-2.5 font-body text-sm outline-none" />
              </div>
              <div>
                <label className="font-body text-[10px] font-bold uppercase tracking-wide text-muted">N° de operación (opcional)</label>
                <input value={transferRef} onChange={(e) => setTransferRef(e.target.value)} className="mt-1 w-full bg-cream border-2 border-ink/10 rounded-xl px-3 py-2.5 font-body text-sm outline-none" />
              </div>
            </Card>
            <p className="font-body text-[10px] text-muted mt-2">Tu pedido queda pendiente hasta que confirmemos la acreditación.</p>
            <Button variant="accent" className="w-full mt-4" onClick={submitTransfer} disabled={!transferHolder.trim() || !transferBank.trim()}>Ya transferí</Button>
          </>
        )}

        {step === "cash_confirm" && (
          <>
            <h1 className="font-display font-extrabold text-xl text-ink mb-1">Pago en efectivo</h1>
            <p className="font-body text-sm text-muted mb-4">Vas a pagar {fmt(amount)} en efectivo cuando retirás o recibís tu pedido.</p>
            <Card className="p-4 bg-mustard/10 border-mustard/40">
              <p className="font-body text-xs text-ink/70 leading-relaxed">
                Tu pedido se va a registrar como <span className="font-semibold">pendiente de confirmación</span>. Recién va a figurar como pagado cuando un vendedor reciba tu efectivo y confirme el código de tu pedido.
              </p>
            </Card>
            <Button variant="accent" className="w-full mt-4" onClick={confirmCash}>Entendido, registrar pedido</Button>
          </>
        )}

        {step === "processing" && (
          <div className="flex-1 flex flex-col items-center justify-center gap-3">
            <div className="w-10 h-10 border-4 border-ink/15 border-t-ink rounded-full animate-spin" />
            <p className="font-body text-sm text-muted">
              {method?.id === "transferencia" ? "Registrando tu transferencia..." : method?.id === "efectivo" ? "Registrando pedido..." : "Procesando pago..."}
            </p>
          </div>
        )}

        {step === "success" && (
          <div className="flex-1 flex flex-col items-center justify-center text-center gap-3 px-4">
            <div className={`w-16 h-16 rounded-full border-2 flex items-center justify-center ${method?.id === "mercadopago" ? "bg-ok/15 border-ok" : "bg-mustard/15 border-mustardDark"}`}>
              {method?.id === "mercadopago" ? <IconCheck className="w-7 h-7 text-ok" /> : <IconClock className="w-7 h-7 text-mustardDark" />}
            </div>
            <h1 className="font-display font-extrabold text-xl text-ink">
              {method?.id === "mercadopago" ? "¡Pago aprobado!" : method?.id === "transferencia" ? "Transferencia registrada" : "Pedido registrado"}
            </h1>
            <p className="font-body text-sm text-muted">
              {method?.id === "mercadopago"
                ? `Pagaste ${fmt(amount)} con ${method?.label.toLowerCase()}.`
                : method?.id === "transferencia"
                ? "Verificaremos tu transferencia y confirmaremos tu pedido cuando se acredite."
                : "Tu pedido queda pendiente de confirmación hasta que un vendedor reciba tu pago en efectivo."}
            </p>
            <Button variant="accent" className="w-full mt-2" onClick={finish}>Ver mi pedido</Button>
          </div>
        )}
      </div>
    </div>
  );
};

const CartScreen = ({ cart, onRemove, onUpdateQty, onClose, flash, onConfirmSale, customer }) => {
  const [mode, setMode] = useState("total"); // total | seña
  const [promoInput, setPromoInput] = useState("");
  const [appliedPromo, setAppliedPromo] = useState(null); // { code, pct, label }
  const [promoError, setPromoError] = useState("");
  const [showPromo, setShowPromo] = useState(false);
  const [client, setClient] = useState("");
  const [address, setAddress] = useState("");
  const [confirming, setConfirming] = useState(false);
  const [confirmed, setConfirmed] = useState(false);

  const subtotal = cart.reduce((a, i) => a + i.price * i.qty, 0);

  const profileDiscountPct = customer?.discountPct || 0;
  const promoDiscount = appliedPromo ? Math.round((subtotal * appliedPromo.pct) / 100) : 0;

  const profileDiscountAmount = Math.round((subtotal * profileDiscountPct) / 100);
  const discountAmount = profileDiscountAmount + promoDiscount;

  const discountedTotal = Math.max(subtotal - discountAmount, 0);
  const amountNow = mode === "seña" ? Math.round(discountedTotal * 0.5) : discountedTotal;
  const pending = mode === "seña" ? discountedTotal - amountNow : 0;

  const applyPromo = () => {
    const code = promoInput.trim().toUpperCase();
    if (!code) return;
    const coupon = COUPON_CODES.find((c) => c.code === code);
    if (coupon) {
      setAppliedPromo({ code, pct: coupon.pct, label: coupon.desc });
      setPromoError("");
    } else if (code.startsWith("REF-")) {
      setAppliedPromo({ code, pct: REFERRAL_DISCOUNT_PCT, label: "Código de referido" });
      setPromoError("");
    } else {
      setAppliedPromo(null);
      setPromoError("Código no válido");
    }
  };

  const ticketText = () => {
    const lines = cart.map((i) => `${i.qty}x ${i.name} — ${fmt(i.price * i.qty)}`).join("\n");
    return `QUICK SALE — Resumen de compra\n\n${lines}\n\nSubtotal: ${fmt(subtotal)}${discountAmount > 0 ? `\nDescuento: -${fmt(discountAmount)}` : ""}\n${mode === "seña" ? `Seña pagada: ${fmt(amountNow)}\nPendiente: ${fmt(pending)}` : `Total pagado: ${fmt(amountNow)}`}`;
  };

  const shareTicket = async () => {
    const text = ticketText();
    if (navigator.share) {
      try { await navigator.share({ title: "Ticket Quick Sale", text }); } catch (e) {}
    } else if (navigator.clipboard) {
      await navigator.clipboard.writeText(text);
      flash("Ticket copiado al portapapeles");
    }
  };

  const confirmSale = (paymentMethod, transferInfo) => {
    setConfirming(false);
    setConfirmed(true);
    if (onConfirmSale) {
      const { status, paymentConfirmed, liveStep } = getPaymentStatus(paymentMethod, mode);
      onConfirmSale({
        id: "#" + Math.floor(1000 + Math.random() * 9000),
        client: client.trim() || "Sin nombre",
        deliveryAddress: address.trim(),
        items: cart,
        subtotal,
        discount: discountAmount,
        total: discountedTotal,
        mode,
        paid: amountNow,
        pending,
        date: new Date().toLocaleDateString("es-AR"),
        time: new Date().toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" }),
        status,
        paymentConfirmed,
        paymentMethod,
        transferInfo: transferInfo || null,
        liveStep,
        liveStepTime: new Date().toLocaleTimeString("es-AR", { hour: "2-digit", minute: "2-digit" }),
        reviewed: false,
      });
    }
    flash("Venta registrada");
  };

  return (
    <div className="px-4 pt-6 pb-28">
      <ScreenTitle
        action={
          onClose && (
            <button onClick={onClose} className="p-2">
              <IconX className="w-5 h-5 text-muted" />
            </button>
          )
        }
      >
        Carrito
      </ScreenTitle>

      {cart.length === 0 ? (
        <Card className="p-8 text-center">
          <p className="font-body text-sm text-muted">Todavía no agregaste nada</p>
        </Card>
      ) : (
        <>
          <Card className="p-4 flex flex-col divide-y-2 divide-dashed divide-ink/10">
            {cart.map((item) => (
              <div key={item.id} className="flex items-center gap-3 py-2.5 first:pt-0 last:pb-0">
                <div className="w-10 h-10 rounded-xl overflow-hidden border border-ink/10 flex-shrink-0">
                  <ProductIllustration type={item.illustration} />
                </div>
                <div className="flex-1 min-w-0">
                  <div className="font-body font-semibold text-sm text-ink truncate">{item.name}</div>
                  <div className="flex items-center gap-1.5 mt-1">
                    <button
                      onClick={() => onUpdateQty(item.id, Math.max(0, item.qty - 1))}
                      aria-label={`Restar una unidad de ${item.name}`}
                      className="w-6 h-6 flex items-center justify-center rounded-lg border-2 border-ink/15 font-display font-bold text-ink/60 text-sm"
                    >
                      −
                    </button>
                    <span className="font-body text-xs font-semibold text-ink w-4 text-center">{item.qty}</span>
                    <button
                      onClick={() => onUpdateQty(item.id, item.qty + 1)}
                      disabled={typeof item.stock === "number" && item.qty >= item.stock}
                      aria-label={`Sumar una unidad de ${item.name}`}
                      className="w-6 h-6 flex items-center justify-center rounded-lg border-2 border-ink/15 font-display font-bold text-ink/60 text-sm disabled:opacity-30 disabled:cursor-not-allowed"
                    >
                      +
                    </button>
                    {typeof item.stock === "number" && item.qty >= item.stock && (
                      <span className="font-body text-[10px] text-low ml-1">Máximo disponible</span>
                    )}
                  </div>
                </div>
                <div className="flex items-center gap-3 flex-shrink-0">
                  <span className="font-display font-bold text-sm">{fmt(item.price * item.qty)}</span>
                  <button onClick={() => onRemove(item.id)} className="text-ink/30" aria-label={`Quitar ${item.name} del carrito`}>
                    <IconX className="w-4 h-4" />
                  </button>
                </div>
              </div>
            ))}
          </Card>

          <div className="mt-4">
            <label className="font-body text-[10px] font-bold uppercase tracking-wide text-muted">Cliente (opcional)</label>
            <input
              value={client}
              onChange={(e) => setClient(e.target.value)}
              placeholder="Nombre del cliente / evento"
              className="mt-1 w-full bg-cream border-2 border-ink/10 rounded-xl px-3 py-2.5 font-body text-sm outline-none"
            />
          </div>

          <div className="mt-4">
            <label className="font-body text-[10px] font-bold uppercase tracking-wide text-muted flex items-center gap-1">
              <IconMapPin className="w-3 h-3" /> Dirección de entrega (opcional)
            </label>
            <input
              value={address}
              onChange={(e) => setAddress(e.target.value)}
              placeholder="Dónde armamos el evento"
              className="mt-1 w-full bg-cream border-2 border-ink/10 rounded-xl px-3 py-2.5 font-body text-sm outline-none"
            />
          </div>

          <div className="mt-4">
            <label className="font-body text-[10px] font-bold uppercase tracking-wide text-muted flex items-center gap-1">
              <IconTag className="w-3 h-3" /> Descuento
            </label>
            {customer ? (
              <div className="mt-1.5 flex items-center justify-between bg-ok/10 border border-ok/30 rounded-xl px-3 py-2.5">
                <span className="font-body text-xs text-cream/80">Por tu perfil ({customer.label})</span>
                <span className="font-display font-bold text-sm text-ok">-{profileDiscountPct}%</span>
              </div>
            ) : (
              <div className="mt-1.5 bg-cream border border-ink/10 rounded-xl px-3 py-2.5">
                <span className="font-body text-xs text-muted">Registrate para acceder a descuentos según tu perfil</span>
              </div>
            )}

            {!showPromo ? (
              <button onClick={() => setShowPromo(true)} className="font-body text-xs font-semibold text-muted hover:text-ink mt-2">
                + Tengo un código promocional o de referido
              </button>
            ) : appliedPromo ? (
              <div className="mt-2 flex items-center justify-between bg-ok/10 border border-ok/30 rounded-xl px-3 py-2.5">
                <div>
                  <span className="font-body text-xs font-semibold text-cream">{appliedPromo.code}</span>
                  <span className="font-body text-[11px] text-cream/50 block">{appliedPromo.label}</span>
                </div>
                <div className="flex items-center gap-2">
                  <span className="font-display font-bold text-sm text-ok">-{appliedPromo.pct}%</span>
                  <button onClick={() => { setAppliedPromo(null); setPromoInput(""); }} className="text-cream/40 hover:text-low"><IconX className="w-3.5 h-3.5" /></button>
                </div>
              </div>
            ) : (
              <div className="mt-2">
                <div className="flex gap-2">
                  <input
                    value={promoInput}
                    onChange={(e) => { setPromoInput(e.target.value); setPromoError(""); }}
                    onKeyDown={(e) => e.key === "Enter" && applyPromo()}
                    placeholder="Ej. BIENVENIDO10 o REF-JUAN123"
                    className="flex-1 bg-white border-2 border-ink/10 rounded-xl px-3 py-2 font-body text-sm outline-none uppercase"
                  />
                  <Button variant="ghost" onClick={applyPromo}>Aplicar</Button>
                </div>
                {promoError && <p className="font-body text-[11px] text-low mt-1">{promoError}</p>}
              </div>
            )}
          </div>

          <div className="mt-4">
            <label className="font-body text-[10px] font-bold uppercase tracking-wide text-muted">Forma de pago</label>
            <div className="mt-1.5 grid grid-cols-2 border-2 border-ink rounded-xl overflow-hidden">
              <button
                onClick={() => setMode("total")}
                className={`py-2.5 font-display font-bold text-xs uppercase ${mode === "total" ? "bg-ink text-mustard" : "bg-white text-ink"}`}
              >
                Pago total
              </button>
              <button
                onClick={() => setMode("seña")}
                className={`py-2.5 font-display font-bold text-xs uppercase border-l-2 border-ink ${mode === "seña" ? "bg-ink text-mustard" : "bg-white text-ink"}`}
              >
                Seña 50%
              </button>
            </div>
          </div>

          <Card className="mt-4 p-4 bg-ink border-ink">
            <div className="flex justify-between font-body text-xs text-cream/60 py-1">
              <span>Subtotal</span><span>{fmt(subtotal)}</span>
            </div>
            {discountAmount > 0 && (
              <div className="flex justify-between font-body text-xs text-mustard py-1">
                <span>Descuento aplicado</span><span>-{fmt(discountAmount)}</span>
              </div>
            )}
            {mode === "seña" && (
              <div className="flex justify-between font-body text-xs text-cream/60 py-1">
                <span>Pendiente (evento)</span><span>{fmt(pending)}</span>
              </div>
            )}
            <div className="flex justify-between font-display font-extrabold text-base text-mustard pt-2 mt-1 border-t border-dashed border-cream/20">
              <span>Pagás ahora</span><span>{fmt(amountNow)}</span>
            </div>
          </Card>

          {mode === "seña" && (
            <p className="font-body text-[11px] text-muted mt-2 text-center">
              El saldo restante se abona al retirar / en el evento.
            </p>
          )}

          {confirmed ? (
            <Card className="mt-4 p-4 text-center bg-ok/5 border-ok/30">
              <div className="flex items-center justify-center gap-1.5 font-display font-bold text-sm text-ok"><IconCheck className="w-4 h-4" /> Venta confirmada</div>
              <p className="font-body text-xs text-muted mt-1">Pagaste {fmt(amountNow)}{mode === "seña" ? ` de ${fmt(discountedTotal)}` : ""}</p>
              <Button variant="ghost" className="w-full mt-3 flex items-center justify-center gap-2" onClick={shareTicket}>
                <IconShare className="w-4 h-4" /> Compartir ticket
              </Button>
            </Card>
          ) : (
            <Button variant="accent" className="w-full mt-4" onClick={() => setConfirming(true)}>Reservar ahora</Button>
          )}
        </>
      )}

      {confirming && (
        <PaymentGatewayScreen
          amount={amountNow}
          label={mode === "seña" ? "Confirmá tu seña" : "Confirmá tu pago"}
          onCancel={() => setConfirming(false)}
          onSuccess={(method, transferInfo) => confirmSale(method, transferInfo)}
        />
      )}
    </div>
  );
};

/* ---------------- LISTA DE INVITADOS (RSVP) ---------------- */
const RSVP_STATUSES = ["Pendiente", "Confirmado", "No asiste"];
const InvitadosScreen = ({ onBack, flash }) => {
  const [guests, setGuests] = useState([]);
  const [name, setName] = useState("");
  const [contact, setContact] = useState("");

  const add = () => {
    if (!name.trim()) return;
    setGuests((p) => [{ id: Date.now(), name: name.trim(), contact: contact.trim(), status: "Pendiente" }, ...p]);
    setName(""); setContact("");
  };

  const setStatus = (id, status) => setGuests((p) => p.map((g) => (g.id === id ? { ...g, status } : g)));
  const remove = (id) => setGuests((p) => p.filter((g) => g.id !== id));

  const confirmados = guests.filter((g) => g.status === "Confirmado").length;
  const pendientes = guests.filter((g) => g.status === "Pendiente").length;

  return (
    <div className="px-4 pt-6 pb-28">
      <ToolHeader title="Lista de invitados" onBack={onBack} />

      {guests.length > 0 && (
        <div className="grid grid-cols-3 gap-2 mb-4">
          <Card className="p-2.5 text-center"><div className="font-display font-extrabold text-lg text-ink">{guests.length}</div><div className="font-body text-[9px] text-muted">Total</div></Card>
          <Card className="p-2.5 text-center"><div className="font-display font-extrabold text-lg text-ok">{confirmados}</div><div className="font-body text-[9px] text-muted">Confirmados</div></Card>
          <Card className="p-2.5 text-center"><div className="font-display font-extrabold text-lg text-mustardDark">{pendientes}</div><div className="font-body text-[9px] text-muted">Pendientes</div></Card>
        </div>
      )}

      <Card className="p-3 mb-4 flex gap-2 items-end">
        <div className="flex-1">
          <label className="font-body text-[10px] font-bold uppercase tracking-wide text-muted">Nombre</label>
          <input value={name} onChange={(e) => setName(e.target.value)} onKeyDown={(e) => e.key === "Enter" && add()} className="mt-1 w-full bg-cream border-2 border-ink/10 rounded-xl px-2.5 py-2 font-body text-sm outline-none" />
        </div>
        <div className="flex-1">
          <label className="font-body text-[10px] font-bold uppercase tracking-wide text-muted">Contacto</label>
          <input value={contact} onChange={(e) => setContact(e.target.value)} placeholder="Tel. o email" className="mt-1 w-full bg-cream border-2 border-ink/10 rounded-xl px-2.5 py-2 font-body text-sm outline-none" />
        </div>
        <button onClick={add} className="w-9 h-9 rounded-xl bg-ink text-mustard flex items-center justify-center flex-shrink-0"><IconPlus className="w-4 h-4" /></button>
      </Card>

      {guests.length === 0 ? (
        <Card className="p-8 text-center"><p className="font-body text-sm text-muted">Todavía no agregaste invitados</p></Card>
      ) : (
        <div className="flex flex-col gap-2">
          {guests.map((g) => (
            <Card key={g.id} className="p-3">
              <div className="flex items-center justify-between mb-2">
                <div>
                  <div className="font-body text-sm font-semibold text-ink">{g.name}</div>
                  {g.contact && <div className="font-body text-[11px] text-muted">{g.contact}</div>}
                </div>
                <button onClick={() => remove(g.id)} className="text-ink/30 hover:text-low flex-shrink-0"><IconX className="w-4 h-4" /></button>
              </div>
              <div className="grid grid-cols-3 gap-1.5">
                {RSVP_STATUSES.map((s) => (
                  <button
                    key={s}
                    onClick={() => setStatus(g.id, s)}
                    className={`text-[10px] font-semibold px-2 py-1.5 rounded-xl border text-center ${g.status === s ? "bg-ink text-mustard border-ink" : "bg-white text-ink/60 border-ink/15"}`}
                  >
                    {s}
                  </button>
                ))}
              </div>
            </Card>
          ))}
        </div>
      )}
    </div>
  );
};

const CANCEL_REASONS = [

const PedidosScreen = ({ orders, setOrders, onOpenCart, cartCount, flash }) => {
  const [selected, setSelected] = useState(null);
  const [showAddExtras, setShowAddExtras] = useState(false);
  const [confirmingCancel, setConfirmingCancel] = useState(false);
  const [cancelReason, setCancelReason] = useState(null);
  const [cancelComment, setCancelComment] = useState("");
  const [reviewRating, setReviewRating] = useState(5);
  const [reviewComment, setReviewComment] = useState("");
  const totalHoy = orders.reduce((a, o) => a + o.paid, 0);
  const [filter, setFilter] = useState("todos");

  const cancelOrder = () => {
    if (!cancelReason) return;
    const updated = { ...selected, status: "Cancelado", cancelReason, cancelComment: cancelComment.trim() };
    setOrders((prev) => prev.map((o) => (o.id === selected.id ? updated : o)));
    setSelected(updated);
    setConfirmingCancel(false);
    setCancelReason(null);
    setCancelComment("");
    if (flash) flash(`Pedido ${selected.id} cancelado`);
  };

  const addExtra = (product) => {
    setOrders((prev) => prev.map((o) => {
      if (o.id !== selected.id) return o;
      const existing = o.items.find((i) => i.name === product.name);
      const items = existing
        ? o.items.map((i) => (i.name === product.name ? { ...i, qty: i.qty + 1 } : i))
        : [...o.items, { name: product.name, qty: 1, price: product.price, illustration: product.illustration }];
      const newSubtotal = items.reduce((a, i) => a + i.price * i.qty, 0);
      const updated = { ...o, items, subtotal: newSubtotal, total: newSubtotal - (o.discount || 0), pending: (o.pending || 0) + product.price };
      setSelected(updated);
      return updated;
    }));
  };

  const submitReview = () => {
    const updated = { ...selected, reviewed: true, rating: reviewRating, comment: reviewComment };
    setOrders((prev) => prev.map((o) => (o.id === selected.id ? updated : o)));
    setSelected(updated);
  };

  const filtered = orders.filter((o) => {
    if (filter === "todos") return true;
    if (filter === "entregar") return (o.liveStep ?? 1) < 4;
    if (filter === "finalizados") return (o.liveStep ?? 1) >= 5;
    return true;
  });

  return (
    <div className="px-4 pt-6 pb-28">
      <ScreenTitle
        action={
          <button onClick={onOpenCart} className="relative bg-ink rounded-xl p-2" aria-label="Ver carrito">
            <IconCart className="w-5 h-5 text-mustard" />
            {cartCount > 0 && (
              <span className="absolute -top-1.5 -right-1.5 bg-mustard text-ink text-[10px] font-bold w-4 h-4 rounded-full flex items-center justify-center border border-ink">
                {cartCount}
              </span>
            )}
          </button>
        }
      >
        Pedidos
      </ScreenTitle>

      {orders.length > 0 && (
        <Card className="p-4 mb-4 bg-ink border-ink">
          <div className="flex justify-between font-body text-xs text-cream/60">
            <span>Cobrado hoy</span><span className="font-display font-bold text-mustard text-sm">{fmt(totalHoy)}</span>
          </div>
          <div className="flex justify-between font-body text-xs text-cream/60 mt-1">
            <span>Pedidos</span><span>{orders.length}</span>
          </div>
        </Card>
      )}

      {orders.length > 0 && (
        <div className="flex gap-2 mb-4 overflow-x-auto no-scrollbar">
          <Chip active={filter === "todos"} onClick={() => setFilter("todos")}>Todos</Chip>
          <Chip active={filter === "entregar"} onClick={() => setFilter("entregar")}>En curso</Chip>
          <Chip active={filter === "finalizados"} onClick={() => setFilter("finalizados")}>Finalizados</Chip>
        </div>
      )}

      {orders.length === 0 ? (
        <Card className="p-8 text-center">
          <p className="font-body text-sm text-muted">Todavía no hay pedidos — se registran acá apenas confirmás una venta en Tienda.</p>
        </Card>
      ) : filtered.length === 0 ? (
        <Card className="p-8 text-center">
          <p className="font-body text-sm text-muted">Nada en este filtro</p>

        <div className="flex flex-col gap-2.5">
          {filtered.map((o) => {
            const step = o.liveStep ?? 1;
            return (
              <button key={o.id} onClick={() => { setSelected(o); setShowAddExtras(false); setConfirmingCancel(false); setCancelReason(null); setCancelComment(""); }} className="text-left">
                <Card className="p-3.5">
                  <div className="flex items-center justify-between">
                    <div>
                      <div className="font-body font-semibold text-sm text-ink">{o.client}</div>

      {selected && (

                    <p className="font-body text-xs text-ink/60">{selected.comment || "Sin comentario"}</p>
                  </Card>
                ) : (
                  <>
                    <div className="flex gap-1 mb-2">
                      {Array.from({ length: 5 }).map((_, i) => (
                        <button key={i} onClick={() => setReviewRating(i + 1)}>
                          <IconStar className={`w-6 h-6 ${i < reviewRating ? "text-mustardDark" : "text-ink/15"}`} />
                        </button>
                      ))}
                    </div>
                    <textarea
                      value={reviewComment}
                      onChange={(e) => setReviewComment(e.target.value)}
                      placeholder="Contanos cómo te fue (opcional)"
                      rows={2}
                      className="w-full bg-cream border-2 border-ink/10 rounded-xl px-3 py-2 font-body text-sm outline-none resize-none mb-2"
                    />
                    <Button variant="accent" className="w-full" onClick={submitReview}>Enviar reseña</Button>
                  </>
                )}
              </div>
            )}
          </Card>
        </div>
      )}
    </div>
  );
};

/* ---------------- APP ---------------- */
const SAMPLE_ORDER = {
  id: "#4821", client: "Boda Martínez", date: "20 sept 2026", time: "11:20",
  deliveryAddress: "Salón Los Aromos, Ruta 8 km 45", items: [
    { name: "Pack Premium", qty: 1, price: 68000, illustration: "table" },
    { name: "Iluminación LED", qty: 1, price: 15000, illustration: "lights" },
  ],
  subtotal: 83000, discount: 0, total: 83000, mode: "seña",
  paid: 41500, pending: 41500, status: "Seña pagada", paymentMethod: "mercadopago", paymentConfirmed: true,
  liveStep: 2, liveStepTime: "09:05", reviewed: false,
};

function App() {
  const [tab, setTab] = useState("inicio");
  const [orders, setOrders] = useState([SAMPLE_ORDER]);
  const [customer, setCustomer] = useState(null);
  const [showCart, setShowCart] = useState(false);
  const [tool, setTool] = useState(null);
  const [cart, setCart] = useState([]);
  const [toast, setToast] = useState(null);
  const [online, setOnline] = useState(navigator.onLine);
  const [eventDate, setEventDate] = useState("");
  const [tiendaCategory, setTiendaCategory] = useState(null);
  const [productDetail, setProductDetail] = useState(null);

  const flash = (msg) => {
    setToast(msg);
    setTimeout(() => setToast(null), 1800);
  };

  useEffect(() => {
    const goOnline = () => setOnline(true);
    const goOffline = () => setOnline(false);
    window.addEventListener("online", goOnline);
    window.addEventListener("offline", goOffline);
    return () => {
      window.removeEventListener("online", goOnline);
      window.removeEventListener("offline", goOffline);
    };
  }, []);

  const addToCart = (p) => {
    let blocked = false;
    setCart((prev) => {
      const existing = prev.find((i) => i.id === p.id);
      const currentQty = existing ? existing.qty : 0;
      if (typeof p.stock === "number" && currentQty >= p.stock) {
        blocked = true;
        return prev;
      }
      if (existing) return prev.map((i) => (i.id === p.id ? { ...i, qty: i.qty + 1 } : i));
      return [...prev, { ...p, qty: 1 }];
    });
    if (blocked) flash(`Solo quedan ${p.stock} unidades de ${p.name}`);
    else flash(`${p.name} agregado`);
  };

  const removeFromCart = (id) => setCart((prev) => prev.filter((i) => i.id !== id));
  const updateCartQty = (id, qty) => {
    if (qty <= 0) { removeFromCart(id); return; }
    setCart((prev) => prev.map((i) => {
      if (i.id !== id) return i;
      const capped = typeof i.stock === "number" ? Math.min(qty, i.stock) : qty;
      if (capped < qty) flash(`Solo quedan ${i.stock} unidades de ${i.name}`);
      return { ...i, qty: capped };
    }));
  };
  const cartCount = cart.reduce((a, i) => a + i.qty, 0);

  const confirmSale = (order) => {
    setOrders((prev) => [order, ...prev]);
    setCart([]);
  };

  const navigate = (key) => { setTool(null); setShowCart(false); setTab(key); };

  let screen;
  if (productDetail) {
    screen = <ProductDetailScreen product={productDetail} cart={cart} onBack={() => setProductDetail(null)} onAdd={addToCart} onOpenDetail={setProductDetail} flash={flash} />;
  } else if (tool) {
    const back = () => setTool(null);
    if (tool === "portal") screen = <PortalScreen onBack={back} flash={flash} onConfirmSale={confirmSale} navigate={navigate} />;
    else if (tool === "bundle") screen = <BundleScreen onBack={back} onAddBundle={addToCart} />;
    else if (tool === "notificaciones") screen = <NotificacionesScreen orders={orders} onBack={back} navigate={navigate} />;
    else if (tool === "registro") screen = <RegistroScreen customer={customer} onSave={setCustomer} onBack={back} flash={flash} orders={orders} />;
    else if (tool === "soporte") screen = <SoporteScreen onBack={back} />;
    else if (tool === "capacidad") screen = <CapacidadScreen onBack={back} onGoToTienda={() => navigate("tienda")} />;
    else if (tool === "galeria") screen = <GaleriaScreen onBack={back} />;
    else if (tool === "invitados") screen = <InvitadosScreen onBack={back} flash={flash} />;
  } else if (showCart) {
    screen = <CartScreen cart={cart} onRemove={removeFromCart} onUpdateQty={updateCartQty} onClose={() => setShowCart(false)} flash={flash} onConfirmSale={confirmSale} customer={customer} />;
  } else if (tab === "inicio") {
    screen = <InicioScreen orders={orders} customer={customer} onOpenTool={setTool} onOpenNotifications={() => setTool("notificaciones")} online={online} navigate={navigate} onNavigateCategory={setTiendaCategory} />;
  } else if (tab === "tienda") {
    screen = <TiendaScreen onOpenDetail={setProductDetail} cart={cart} cartCount={cartCount} onOpenCart={() => setShowCart(true)} onOpenBundle={() => setTool("bundle")} eventDate={eventDate} setEventDate={setEventDate} initialCategory={tiendaCategory} />;
  } else if (tab === "ventas") {
    screen = <PedidosScreen orders={orders} setOrders={setOrders} cartCount={cartCount} onOpenCart={() => setShowCart(true)} flash={flash} />;
  }

  return (
    <div className="max-w-md mx-auto min-h-screen bg-[#1A1A1A] relative font-body">
      <div className="min-h-screen bg-[#1A1A1A]">{screen}</div>

      {toast && (
        <div className="fixed bottom-24 left-1/2 -translate-x-1/2 max-w-[90%] bg-ink text-mustard font-body text-xs font-semibold px-4 py-2.5 rounded-full shadow-brut border-2 border-ink z-50">
          {toast}
        </div>
      )}

      {!showCart && !tool && !productDetail && <BottomNav active={tab} onChange={setTab} />}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
